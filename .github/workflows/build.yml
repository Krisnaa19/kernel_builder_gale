name: Build zauksk + ReSukiSU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: zauksk Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:

      # ============================================================
      # 1. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            bc \
            bison \
            flex \
            ccache \
            rsync \
            cpio \
            lz4 \
            device-tree-compiler \
            python3 \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            build-essential

      # ============================================================
      # 2. CLONE SOURCE TREE
      #
      # SOURCE:
      # https://github.com/xxblebleblexx/android_kernel_xiaomi_gale
      #
      # BRANCH:
      # dev
      # ============================================================
      - name: Clone Kernel Source
        run: |
          set -eux

          echo "=========================================="
          echo "CLONE KERNEL SOURCE"
          echo "=========================================="

          git clone \
            --depth=1 \
            --single-branch \
            --branch dev \
            https://github.com/xxblebleblexx/android_kernel_xiaomi_gale.git \
            kernel

          cd kernel

          echo "=========================================="
          echo "SOURCE INFORMATION"
          echo "=========================================="

          echo "Branch:"
          git branch --show-current

          echo "Commit:"
          git log -1 --oneline

          echo "Remote:"
          git remote -v

          echo "=========================================="
          echo "VERIFY TREE"
          echo "=========================================="

          test -f Makefile
          test -f arch/arm64/configs/gale_defconfig
          test -f build.config.mtk.aarch64

          echo "OK: Makefile"
          echo "OK: gale_defconfig"
          echo "OK: build.config.mtk.aarch64"

          echo "Kernel version:"
          make kernelversion

      # ============================================================
      # 3. VERIFY GALE DEFCONFIG
      # ============================================================
      - name: Verify gale_defconfig
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "VERIFY GALE DEFCONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_MACH_MT6768=|CONFIG_ARCH_MTK_PROJECT=|CONFIG_NR_CPUS=|CONFIG_LTO=|CONFIG_LTO_CLANG=|CONFIG_THINLTO=' \
            arch/arm64/configs/gale_defconfig \
            || true

          echo "gale_defconfig exists and is readable."

      # ============================================================
      # 4. SHOW BUILD CONFIG
      # ============================================================
      - name: Verify build.config.mtk.aarch64
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "BUILD CONFIG"
          echo "=========================================="

          cat build.config.mtk.aarch64

      # ============================================================
      # 5. INSTALL RESUKISU
      # ============================================================
      - name: Install ReSukiSU
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "INSTALL RESUKISU"
          echo "=========================================="

          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash

          test -d KernelSU

          echo "ReSukiSU installed successfully."

      # ============================================================
      # 6. VERIFY MANUAL HOOK
      # ============================================================
      - name: Verify ReSukiSU Manual Hook
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "VERIFY MANUAL HOOK"
          echo "=========================================="

          if grep -Rqs \
            "config KSU_MANUAL_HOOK" \
            KernelSU; then

            echo "OK: CONFIG_KSU_MANUAL_HOOK exists."

          else

            echo "ERROR:"
            echo "CONFIG_KSU_MANUAL_HOOK was not found."

            exit 1
          fi

      # ============================================================
      # 7. DOWNLOAD CLANG R383902
      #
      # IMPORTANT:
      # Do NOT use git sparse-checkout.
      #
      # Download the exact compiler directly from AOSP.
      # ============================================================
      - name: Install Clang r383902
        run: |
          set -eux

          echo "=========================================="
          echo "INSTALL ANDROID CLANG R383902"
          echo "=========================================="

          mkdir -p "$HOME/toolchains/clang-r383902"

          cd "$HOME/toolchains/clang-r383902"

          curl -L \
            --retry 5 \
            --retry-delay 3 \
            -o clang-r383902.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r383902.tar.gz"

          test -s clang-r383902.tar.gz

          echo "Extracting Clang..."

          tar \
            -xzf \
            clang-r383902.tar.gz

          rm -f clang-r383902.tar.gz

          echo "=========================================="
          echo "VERIFY CLANG"
          echo "=========================================="

          test -x bin/clang
          test -x bin/ld.lld
          test -x bin/llvm-ar
          test -x bin/llvm-nm
          test -x bin/llvm-objcopy
          test -x bin/llvm-objdump
          test -x bin/llvm-size
          test -x bin/llvm-strip

          echo "Clang:"
          bin/clang --version

          echo "LLD:"
          bin/ld.lld --version

          echo "Clang r383902 installation OK."

      # ============================================================
      # 8. PREPARE KERNEL CONFIG
      # ============================================================
      - name: Prepare kernel configuration
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "PREPARE KERNEL CONFIG"
          echo "=========================================="

          export CLANG="$HOME/toolchains/clang-r383902"

          export PATH="$CLANG/bin:$PATH"

          export LD_LIBRARY_PATH="$CLANG/lib64:${LD_LIBRARY_PATH:-}"

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-

          export LLVM=1
          export LLVM_IAS=1

          rm -rf out

          mkdir -p out

          echo "=========================================="
          echo "STEP 1: GALE DEFCONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            LLVM_IAS=1 \
            gale_defconfig

          test -f out/.config

          echo "gale_defconfig completed."

          # --------------------------------------------------------
          # Kernel name
          # --------------------------------------------------------

          scripts/config \
            --file out/.config \
            --set-str LOCALVERSION "-zauksk"

          # --------------------------------------------------------
          # ReSukiSU
          # --------------------------------------------------------

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          # --------------------------------------------------------
          # Manual Hook
          # --------------------------------------------------------

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_MANUAL_HOOK

          echo "=========================================="
          echo "RUN OLDDEFCONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo "=========================================="
          echo "VERIFY FINAL CONFIG"
          echo "=========================================="

          test -f out/.config
          test -f out/include/config/auto.conf

          grep \
            'CONFIG_KSU=y' \
            out/.config

          grep \
            'CONFIG_KSU_MANUAL_HOOK=y' \
            out/.config

          grep \
            'CONFIG_LOCALVERSION="-zauksk"' \
            out/.config

          echo "=========================================="
          echo "FINAL CONFIG OK"
          echo "=========================================="

      # ============================================================
      # 9. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          export CLANG="$HOME/toolchains/clang-r383902"

          export PATH="$CLANG/bin:$PATH"

          export LD_LIBRARY_PATH="$CLANG/lib64:${LD_LIBRARY_PATH:-}"

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-

          export LLVM=1
          export LLVM_IAS=1

          export KCONFIG_NOSILENTUPDATE=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export OBJSIZE=llvm-size
          export STRIP=llvm-strip

          test -f out/.config
          test -f out/include/config/auto.conf

          echo "=========================================="
          echo "COMPILER"
          echo "=========================================="

          clang --version
          ld.lld --version

          echo "=========================================="
          echo "START BUILD"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            OBJSIZE=llvm-size \
            STRIP=llvm-strip \
            KCONFIG_NOSILENTUPDATE=1 \
            -j"$(nproc)"

          echo "=========================================="
          echo "BUILD FINISHED"
          echo "=========================================="

      # ============================================================
      # 10. CHECK KERNEL IMAGE
      # ============================================================
      - name: Check kernel image
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "CHECK KERNEL IMAGE"
          echo "=========================================="

          if [ -f out/arch/arm64/boot/Image.gz ]; then

            echo "FOUND Image.gz"

            ls -lh \
              out/arch/arm64/boot/Image.gz

          elif [ -f out/arch/arm64/boot/Image ]; then

            echo "FOUND Image"

            ls -lh \
              out/arch/arm64/boot/Image

          else

            echo "ERROR: Kernel image not found."

            find \
              out/arch/arm64/boot \
              -maxdepth 3 \
              -type f \
              -print

            exit 1

          fi

      # ============================================================
      # 11. CLONE ANYKERNEL3
      # ============================================================
      - name: Clone AnyKernel3
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          test -f \
            AnyKernel3/tools/ak3-core.sh

      # ============================================================
      # 12. COPY KERNEL IMAGE
      # ============================================================
      - name: Copy kernel image
        run: |
          set -eux

          rm -f \
            AnyKernel3/Image \
            AnyKernel3/Image.gz \
            AnyKernel3/Image-dtb \
            AnyKernel3/zImage

          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then

            cp \
              kernel/out/arch/arm64/boot/Image.gz \
              AnyKernel3/Image.gz

          elif [ -f kernel/out/arch/arm64/boot/Image ]; then

            cp \
              kernel/out/arch/arm64/boot/Image \
              AnyKernel3/Image

          else

            echo "ERROR: kernel image missing."

            exit 1

          fi

          echo "=========================================="
          echo "KERNEL IMAGE"
          echo "=========================================="

          ls -lh AnyKernel3/Image*

      # ============================================================
      # 13. CONFIGURE ANYKERNEL3
      # ============================================================
      - name: Configure AnyKernel3
        run: |
          set -eux

          cd AnyKernel3

          cat > anykernel.sh <<'EOF'
          ### AnyKernel3
          ### zauksk + ReSukiSU
          ### Redmi 13C / POCO C65
          ### gale / gust

          properties() { '
          kernel.string=zauksk Kernel - ReSukiSU
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0

          device.name1=gale
          device.name2=gust

          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          block=auto;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;

          write_boot;
          EOF

          chmod +x anykernel.sh

          echo "=========================================="
          echo "ANYKERNEL CONFIG"
          echo "=========================================="

          cat anykernel.sh

      # ============================================================
      # 14. BUILD INFORMATION
      # ============================================================
      - name: Add build information
        run: |
          set -eux

          cd AnyKernel3

          cat > version <<'EOF'
          zauksk Kernel
          ReSukiSU
          Manual Hook
          Redmi 13C / POCO C65
          gale / gust
          Linux 4.19
          EOF

          cat > build-info.txt <<'EOF'
          Kernel: zauksk
          Root: ReSukiSU
          Hook: Manual Hook

          Source:
          xxblebleblexx/android_kernel_xiaomi_gale

          Branch:
          dev

          Defconfig:
          gale_defconfig

          Device:
          Redmi 13C / POCO C65

          Codename:
          gale / gust

          Architecture:
          arm64

          Linux:
          4.19

          Compiler:
          Android Clang r383902
          EOF

          cat build-info.txt

      # ============================================================
      # 15. CREATE FLASHABLE ZIP
      # ============================================================
      - name: Create flashable ZIP
        run: |
          set -eux

          mkdir -p release

          cd AnyKernel3

          zip -r9 \
            ../release/zauksk-ReSukiSU-gale.zip \
            . \
            -x ".git/*" \
            -x ".github/*"

          cd ..

          test -f \
            release/zauksk-ReSukiSU-gale.zip

          echo "=========================================="
          echo "FLASHABLE ZIP CREATED"
          echo "=========================================="

          ls -lh \
            release/zauksk-ReSukiSU-gale.zip

      # ============================================================
      # 16. VERIFY ZIP
      # ============================================================
      - name: Verify ZIP
        run: |
          set -eux

          unzip -t \
            release/zauksk-ReSukiSU-gale.zip

          echo "ZIP TEST PASSED."

      # ============================================================
      # 17. SHA256
      # ============================================================
      - name: Generate SHA256
        run: |
          set -eux

          cd release

          sha256sum \
            zauksk-ReSukiSU-gale.zip \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      # ============================================================
      # 18. UPLOAD ONLY FLASHABLE ZIP
      # ============================================================
      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zauksk-ReSukiSU-gale-FLASHABLE
          path: |
            release/zauksk-ReSukiSU-gale.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
