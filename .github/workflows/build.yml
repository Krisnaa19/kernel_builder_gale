name: Build Kernel Gale

on:
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: xxblebleblexx/android_kernel_xiaomi_gale
          ref: dev
          fetch-depth: 1

      - name: Checkout builder repository
        uses: actions/checkout@v4
        with:
          repository: Krisnaa19/kernel_builder_gale
          path: builder

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential \
            libssl-dev libelf-dev libncurses-dev ccache \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            zip unzip curl wget git libcap-dev python3 lsb-release wget software-properties-common gnupg

      - name: Install LLVM Clang 24
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 24 all

          # Set Clang 24 sebagai binary default
          sudo ln -sf /usr/bin/clang-24 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-24 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-24 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-24 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-24 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-24 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-24 /usr/bin/llvm-strip

      - name: Verify Clang 24
        run: |
          clang --version
          ld.lld --version

      - name: Verify kernel base
        run: |
          head -n 10 Makefile

      - name: Rename kernel to
        run: |
          sed -i 's/EXTRAVERSION =.*/EXTRAVERSION = -cip136-st20-#ice bear++/' Makefile

      - name: Inject ReSukiSU Drivers
        run: |
          if [ -d "$GITHUB_WORKSPACE/builder/drivers/resukisu" ]; then
            cp -r "$GITHUB_WORKSPACE/builder/drivers/resukisu" drivers/
          fi

      - name: Inject NoMount v2.0.0
        run: |
          if [ -d "$GITHUB_WORKSPACE/builder/fs/nomount" ]; then
            cp -r "$GITHUB_WORKSPACE/builder/fs/nomount" fs/
          fi

      - name: Prepare kernel config
        run: |
          if [ -f "$GITHUB_WORKSPACE/builder/configs/icebear_defconfig" ]; then
            cp "$GITHUB_WORKSPACE/builder/configs/icebear_defconfig" arch/arm64/configs/icebear_defconfig
          elif [ -f "$GITHUB_WORKSPACE/builder/icebear_defconfig" ]; then
            cp "$GITHUB_WORKSPACE/builder/icebear_defconfig" arch/arm64/configs/icebear_defconfig
          fi

      - name: Verify kernel version string
        run: |
          make O=out ARCH=arm64 icebear_defconfig
          grep -E "CONFIG_LOCALVERSION=" out/.config || true

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export KBUILD_BUILD_USER="root"
          export KBUILD_BUILD_HOST="d866820efa95"

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz

      - name: Verify kernel binary output
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "Error: Image.gz tidak ditemukan!"
            exit 1
          fi
          ls -lh out/arch/arm64/boot/Image.gz
          strings out/arch/arm64/boot/Image.gz | grep -m 1 -E "Linux version"
          strings out/arch/arm64/boot/Image.gz | grep -m 1 -E "clang"

      - name: Prepare AnyKernel3
        run: |
          if [ -d "$GITHUB_WORKSPACE/builder/anykernel" ]; then
            cp -r "$GITHUB_WORKSPACE/builder/anykernel" anykernel
          elif [ -d "$GITHUB_WORKSPACE/builder/anykernel-mod" ]; then
            cp -r "$GITHUB_WORKSPACE/builder/anykernel-mod" anykernel
          else
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          fi

      - name: Configure AnyKernel3 Banner & String
        run: |
          if [ -f "$GITHUB_WORKSPACE/builder/banner" ]; then
            cp "$GITHUB_WORKSPACE/builder/banner" anykernel/banner
          fi
          if [ -f "$GITHUB_WORKSPACE/builder/anykernel.sh" ]; then
            cp "$GITHUB_WORKSPACE/builder/anykernel.sh" anykernel/anykernel.sh
          fi

      - name: Copy Image.gz to AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image.gz anykernel/Image.gz

      - name: Clean unnecessary files
        run: |
          cd anykernel
          rm -rf .git .github README.md

      - name: Create Flashable ZIP
        run: |
          cd anykernel
          zip -r9 "$GITHUB_WORKSPACE/icebear-gale-kernel.zip" *

      - name: Generate SHA256
        run: |
          sha256sum "$GITHUB_WORKSPACE/icebear-gale-kernel.zip" > "$GITHUB_WORKSPACE/icebear-gale-kernel.zip.sha256"
          cat "$GITHUB_WORKSPACE/icebear-gale-kernel.zip.sha256"

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: icebear-gale-kernel
          path: |
            icebear-gale-kernel.zip
            icebear-gale-kernel.zip.sha256

      - name: Complete
        run: |
          echo "Build kernel selesai."
