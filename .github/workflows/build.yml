name: zauksk Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        run: |
          git clone --depth=1 \
            --single-branch \
            --branch dev \
            https://github.com/xxblebleblexx/android_kernel_xiaomi_gale.git \
            kernel

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      - name: Install AArch64 GCC
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Clang r383902
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/toolchains/clang-r383902"
          cd "$HOME/toolchains/clang-r383902"

          curl -L --retry 5 --retry-all-errors \
            -o clang-r383902.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r383902.tar.gz"

          tar -xzf clang-r383902.tar.gz

          test -x bin/clang
          test -x bin/ld.lld
          test -x bin/llvm-ar
          test -x bin/llvm-nm
          test -x bin/llvm-objcopy
          test -x bin/llvm-objdump
          test -x bin/llvm-size
          test -x bin/llvm-strip

          echo "$HOME/toolchains/clang-r383902/bin" >> "$GITHUB_PATH"

      - name: Verify Clang
        shell: bash
        run: |
          set -e

          export PATH="$HOME/toolchains/clang-r383902/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/toolchains/clang-r383902/lib64:${LD_LIBRARY_PATH:-}"

          echo "=== CLANG ==="
          clang --version

          echo "=== LLD ==="
          ld.lld --version

          echo "=== LLVM ==="
          llvm-ar --version
          llvm-nm --version
          llvm-objcopy --version
          llvm-objdump --version
          llvm-size --version
          llvm-strip --version

      - name: Setup ReSukiSU
        working-directory: kernel
        shell: bash
        run: |
          set -e

          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash

      - name: Setup NoMount
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "=== Installing NoMount kernel integration ==="

          curl -LSs \
            "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" \
            | bash -s dev

          echo "=== NoMount source ==="
          test -d fs/nomount

          echo "NoMount integration found:"
          find fs/nomount -maxdepth 2 -type f | sort | head -100

      - name: Prepare kernel config
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export PATH="$HOME/toolchains/clang-r383902/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/toolchains/clang-r383902/lib64:${LD_LIBRARY_PATH:-}"

          mkdir -p out

          echo "=== Running gale_defconfig ==="

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            gale_defconfig

          echo "=== Applying custom configuration ==="

          # Kernel name
          scripts/config \
            --file out/.config \
            --set-str LOCALVERSION "-zauksk"

          # ReSukiSU
          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_MANUAL_HOOK

          # NoMount
          scripts/config \
            --file out/.config \
            --enable CONFIG_NOMOUNT

          # Clang r383902 does not support the Polly options
          # enabled by the original defconfig.
          scripts/config \
            --file out/.config \
            --disable CONFIG_LLVM_POLLY

          echo "=== Synchronizing config ==="

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo "=== Checking final config ==="

          test -f out/.config
          test -f out/include/config/auto.conf

          echo
          echo "----- IMPORTANT CONFIG -----"

          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_NOMOUNT=|CONFIG_LLVM_POLLY=' \
            out/.config || true

          echo
          echo "----- EXPECTED -----"

          grep -q '^CONFIG_KSU=y$' \
            out/.config

          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' \
            out/.config

          grep -q '^CONFIG_NOMOUNT=y$' \
            out/.config

          grep -q '^CONFIG_LOCALVERSION="-zauksk"$' \
            out/.config

          if grep -q '^CONFIG_LLVM_POLLY=y$' out/.config; then
            echo "ERROR: CONFIG_LLVM_POLLY is still enabled!"
            exit 1
          fi

          echo
          echo "Config verification PASSED."

      - name: Verify ReSukiSU Manual Hook
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "=== ReSukiSU verification ==="

          grep -R \
            "CONFIG_KSU_MANUAL_HOOK" \
            kernel include fs 2>/dev/null \
            | head -30 || true

          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config

          echo "ReSukiSU Manual Hook verification PASSED."

      - name: Verify NoMount
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "=== NoMount verification ==="

          test -d fs/nomount

          grep -R \
            "CONFIG_NOMOUNT" \
            fs/nomount fs/Kconfig fs/Makefile \
            2>/dev/null \
            | head -50 || true

          grep -q '^CONFIG_NOMOUNT=y$' out/.config

          echo
          echo "NoMount CONFIG_NOMOUNT=y verification PASSED."

      - name: Build kernel
        working-directory: kernel
        shell: bash
        env:
          KCONFIG_NOSILENTUPDATE: "1"
        run: |
          set -e

          export PATH="$HOME/toolchains/clang-r383902/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/toolchains/clang-r383902/lib64:${LD_LIBRARY_PATH:-}"

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export OBJSIZE=llvm-size
          export STRIP=llvm-strip

          echo "========================================"
          echo "           BUILD ZAUKSK KERNEL"
          echo "========================================"
          echo
          echo "Kernel       : Linux 4.19"
          echo "Device       : Redmi 13C / POCO C65"
          echo "Codename     : gale / gust"
          echo "Kernel name  : zauksk"
          echo "Root         : ReSukiSU"
          echo "Hook         : Manual Hook"
          echo "NoMount      : ENABLED"
          echo "Polly        : DISABLED"
          echo "Compiler     : Clang r383902"
          echo

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            OBJSIZE=llvm-size \
            STRIP=llvm-strip

      - name: Find kernel image
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "=== Searching kernel image ==="

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Found Image.gz"
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image.gz" >> "$GITHUB_ENV"

          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "Found Image"
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image" >> "$GITHUB_ENV"

          else
            echo "ERROR: Kernel image not found."
            find out/arch/arm64/boot -maxdepth 2 -type f -print || true
            exit 1
          fi

      - name: Verify kernel build
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "=== Kernel files ==="
          ls -lah out/arch/arm64/boot/

          echo
          echo "=== Kernel config ==="

          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_NOMOUNT=|CONFIG_LLVM_POLLY=' \
            out/.config || true

          echo
          echo "=== ReSukiSU strings ==="

          strings "$KERNEL_IMAGE" \
            | grep -i "ReSukiSU" \
            | head -20 || true

          echo
          echo "Kernel build verification PASSED."

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -e

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          rm -rf AnyKernel3/.git

          cp "kernel/${KERNEL_IMAGE}" \
            AnyKernel3/

      - name: Configure AnyKernel3
        shell: bash
        run: |
          set -e

          cat > AnyKernel3/anykernel.sh <<'EOF'
          properties() { '
          kernel.string=zauksk Kernel - ReSukiSU - NoMount
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0

          device.name1=gale
          device.name2=gust

          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          block=auto;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;

          write_boot;
          EOF

      - name: Create build information
        shell: bash
        run: |
          set -e

          cat > AnyKernel3/ZAUKSK_BUILD_INFO.txt <<'EOF'
          ==========================================
                    ZAUKSK KERNEL
          ==========================================

          Kernel name : zauksk
          Kernel      : Linux 4.19

          Device      : Xiaomi Redmi 13C
          Device      : POCO C65

          Codenames   : gale / gust

          Root        : ReSukiSU
          Hook        : Manual Hook

          NoMount     : ENABLED
          CONFIG_NOMOUNT=y

          LLVM Polly   : DISABLED

          Compiler    : Clang r383902

          Source      :
          https://github.com/xxblebleblexx/android_kernel_xiaomi_gale

          Branch      : dev

          Defconfig   : gale_defconfig

          ------------------------------------------
          This ZIP is intended for TWRP/custom
          recovery / AnyKernel3 compatible flashing.

          Always keep a backup of the original boot
          image before flashing a custom kernel.
          ==========================================
          EOF

          cat AnyKernel3/ZAUKSK_BUILD_INFO.txt

      - name: Create flashable ZIP
        shell: bash
        run: |
          set -e

          cd AnyKernel3

          rm -f \
            ../zauksk-ReSukiSU-gale.zip \
            ../SHA256SUMS.txt

          zip -r9 \
            ../zauksk-ReSukiSU-gale.zip \
            . \
            -x ".git/*"

          cd ..

          sha256sum \
            zauksk-ReSukiSU-gale.zip \
            > SHA256SUMS.txt

          echo "=== FINAL ZIP ==="
          ls -lh zauksk-ReSukiSU-gale.zip

          echo
          echo "=== SHA256 ==="
          cat SHA256SUMS.txt

      - name: Validate final ZIP
        shell: bash
        run: |
          set -e

          test -f zauksk-ReSukiSU-gale.zip

          echo "=== ZIP CONTENT ==="
          unzip -l zauksk-ReSukiSU-gale.zip

          echo
          echo "=== ZIP TEST ==="
          unzip -t zauksk-ReSukiSU-gale.zip

          echo
          echo "Final flashable ZIP validation PASSED."

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zauksk-ReSukiSU-gale-FLASHABLE
          if-no-files-found: error
          path: |
            zauksk-ReSukiSU-gale.zip
            SHA256SUMS.txt
