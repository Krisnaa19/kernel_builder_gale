name: Build Redmi 13C Kernel - zauksk++ ReSukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev libncurses5-dev libssl-dev bc liblz4-tool libelf-dev python3 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Download AOSP Clang (r383902)
        run: |
          mkdir -p clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r383902.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz

      - name: Clone Tree Wulan
        run: |
          git clone https://github.com/Mayuri-Chan/android_kernel_xiaomi_gale.git --depth=1 kernel-source || \
          git clone https://github.com/wulan17/android_kernel_xiaomi_gale.git --depth=1 kernel-source

      - name: Setup DTC Fix & Inject ReSukiSU (Non-GKI 4.19)
        run: |
          cd kernel-source

          # Fix bug parser Device Tree Compiler (DTC) di Ubuntu 22.04
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l 2>/dev/null || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true

          # Injeksi ReSukiSU khusus 4.19 (Non-GKI)
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s legacy || \
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

          DEFCONFIG=$(find arch/arm64/configs/ -name "*gale*defconfig" | head -n 1)
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG="arch/arm64/configs/gale_defconfig"
          fi
          echo "DEFCONFIG_NAME=$(basename $DEFCONFIG)" >> $GITHUB_ENV

          # Aktifkan konfigurasi root
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG

      - name: Compile Kernel
        run: |
          cd kernel-source
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="zauksk"
          export KBUILD_BUILD_HOST="Builder"

          # 1. Konfigurasi defconfig
          make O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS="-fcommon" \
            $DEFCONFIG_NAME

          # 2. Kompilasi kernel zauksk++
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            LOCALVERSION="-zauksk++" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS="-fcommon" \
            KCFLAGS="-w" \
            KCPPFLAGS="-w"

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 ak3

          sed -i 's/device.name1=.*/device.name1=gale/g' ak3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=gust/g' ak3/anykernel.sh
          sed -i 's|block=.*|block=/dev/block/by-name/boot|g' ak3/anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=auto/g' ak3/anykernel.sh

          IMAGE_FILE=$(find kernel-source/out/arch/arm64/boot/ -type f \( -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" \) | head -n 1)

          if [ -z "$IMAGE_FILE" ]; then
            echo "Kernel Image tidak ditemukan!"
            exit 1
          fi

          cp "$IMAGE_FILE" ak3/$(basename "$IMAGE_FILE")
          cd ak3
          zip -r9 ../Kernel-Redmi13C-zauksk++.zip * -x .git README.md *placeholder

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi13C-zauksk++
          path: Kernel-Redmi13C-zauksk++.zip
          
