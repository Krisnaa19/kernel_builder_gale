name: Build zauksk - Redmi 13C

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build zauksk Kernel
    runs-on: ubuntu-22.04

    env:
      KERNEL_REPO: https://github.com/Mayuri-Chan/android_kernel_xiaomi_gale.git
      KERNEL_BRANCH: lineage-22.2
      DEFCONFIG: gale_defconfig
      ARCH: arm64
      KERNEL_NAME: zauksk

    steps:

      # =========================================================
      # 1. INSTALL DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            python-is-python3 \
            rsync \
            unzip \
            wget \
            zip

      # =========================================================
      # 2. CLONE MAYURI KERNEL
      # =========================================================

      - name: Clone Mayuri Kernel
        run: |
          set -eux

          echo "=========================================="
          echo "       CLONE MAYURI KERNEL"
          echo "=========================================="

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

          cd kernel

          echo
          echo "Repository:"
          git remote -v

          echo
          echo "Commit:"
          git log -1 --oneline

          echo
          echo "Branch:"
          git branch -a

          echo
          echo "Checking defconfig..."

          test -f "arch/arm64/configs/${DEFCONFIG}"

          echo "Found:"
          echo "arch/arm64/configs/${DEFCONFIG}"

      # =========================================================
      # 3. SHOW SOURCE INFORMATION
      # =========================================================

      - name: Kernel information
        working-directory: kernel
        run: |
          set -e

          echo "=========================================="
          echo "        KERNEL INFORMATION"
          echo "=========================================="

          echo "Repository:"
          git remote get-url origin

          echo
          echo "Commit:"
          git log -1 --format='%H'

          echo
          echo "Commit message:"
          git log -1 --format='%s'

          echo
          echo "Kernel version:"
          head -n 5 Makefile

          echo
          echo "Defconfig:"
          grep -E \
            'CONFIG_LOCALVERSION|CONFIG_KSU' \
            "arch/arm64/configs/${DEFCONFIG}" \
            || true

      # =========================================================
      # 4. SETUP RESUKISU
      # =========================================================

      - name: Install ReSukiSU
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "          INSTALL RESUKISU"
          echo "=========================================="

          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash

          echo
          echo "ReSukiSU setup completed."

      # =========================================================
      # 5. CHECK RESUKISU FILES
      # =========================================================

      - name: Verify ReSukiSU
        working-directory: kernel
        run: |
          set -e

          echo "=========================================="
          echo "         VERIFY RESUKISU"
          echo "=========================================="

          echo
          echo "Searching KernelSU files..."

          find . \
            -maxdepth 3 \
            \( -iname '*kernelsu*' -o -iname '*ksu*' \) \
            | head -100 \
            || true

          echo
          echo "Searching KSU configuration..."

          grep -R \
            "CONFIG_KSU" \
            arch/arm64/configs \
            2>/dev/null \
            || true

      # =========================================================
      # 6. PREPARE CONFIG
      # =========================================================

      - name: Prepare kernel config
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "       PREPARE KERNEL CONFIG"
          echo "=========================================="

          mkdir -p out

          echo
          echo "Running ${DEFCONFIG}..."

          make \
            O=out \
            ARCH="${ARCH}" \
            "${DEFCONFIG}"

          echo
          echo "Setting kernel name to ${KERNEL_NAME}..."

          ./scripts/config \
            --file out/.config \
            --set-str CONFIG_LOCALVERSION "-${KERNEL_NAME}"

          echo
          echo "Enabling ReSukiSU..."

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          echo
          echo "Enabling Manual Hook..."

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_MANUAL_HOOK

          echo
          echo "Regenerating configuration..."

          make \
            O=out \
            ARCH="${ARCH}" \
            olddefconfig

          echo
          echo "=========================================="
          echo "        FINAL KERNEL CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_LOCALVERSION|CONFIG_KSU' \
            out/.config \
            || true

      # =========================================================
      # 7. BUILD KERNEL
      # =========================================================

      - name: Build kernel
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "          BUILD ZAUKSK"
          echo "=========================================="

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export AS=llvm-as
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip

          echo
          echo "Compiler:"
          clang --version

          echo
          echo "LLVM:"
          llvm-config --version

          echo
          echo "Starting compilation..."

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1

      # =========================================================
      # 8. CHECK BUILD OUTPUT
      # =========================================================

      - name: Check build output
        working-directory: kernel
        run: |
          set -e

          echo "=========================================="
          echo "          BUILD OUTPUT"
          echo "=========================================="

          echo
          echo "Boot directory:"

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            | sort

          echo
          echo "Checking Image.gz..."

          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "::error::Image.gz tidak ditemukan!"
            exit 1
          fi

          echo "Image.gz found."

          echo
          echo "Kernel size:"

          ls -lh \
            out/arch/arm64/boot/Image.gz

      # =========================================================
      # 9. PREPARE RELEASE FILES
      # =========================================================

      - name: Prepare release
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "        PREPARE RELEASE"
          echo "=========================================="

          rm -rf ../release

          mkdir -p ../release

          # Kernel image
          cp \
            out/arch/arm64/boot/Image.gz \
            ../release/Image.gz

          # DTB
          if [ -d out/arch/arm64/boot/dts ]; then
            cp -r \
              out/arch/arm64/boot/dts \
              ../release/dts
          fi

          # Final config
          cp \
            out/.config \
            ../release/kernel.config

          # Build information
          cat > ../release/build-info.txt <<EOF
Kernel name : zauksk
Device      : Redmi 13C / POCO C65
Codename    : gale / gust
Kernel      : Linux 4.19
Source      : ${KERNEL_REPO}
Branch      : ${KERNEL_BRANCH}
Defconfig   : ${DEFCONFIG}
Root        : ReSukiSU
Hook        : Manual Hook
Architecture: arm64
EOF

          echo
          echo "Release files:"

          find ../release \
            -type f \
            -print \
            | sort

      # =========================================================
      # 10. CREATE SIMPLE ZIP
      # =========================================================

      - name: Create kernel ZIP
        run: |
          set -eux

          cd release

          zip -r \
            ../zauksk-ReSukiSU-gale.zip \
            .

          cd ..

          echo
          echo "ZIP created:"

          ls -lh \
            zauksk-ReSukiSU-gale.zip

      # =========================================================
      # 11. GENERATE SHA256
      # =========================================================

      - name: Generate SHA256
        run: |
          set -eux

          sha256sum \
            release/Image.gz \
            zauksk-ReSukiSU-gale.zip \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      # =========================================================
      # 12. UPLOAD ARTIFACT
      # =========================================================

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: zauksk-ReSukiSU-gale
          path: |
            release/
            zauksk-ReSukiSU-gale.zip
            SHA256SUMS.txt
          if-no-files-found: error

      # =========================================================
      # 13. SUMMARY
      # =========================================================

      - name: Build summary
        run: |
          echo
          echo "=========================================="
          echo "          BUILD SUCCESS"
          echo "=========================================="
          echo
          echo "Device       : Redmi 13C / POCO C65"
          echo "Codename     : gale / gust"
          echo "Kernel       : Linux 4.19"
          echo "Kernel name  : zauksk"
          echo "Root         : ReSukiSU"
          echo "Hook         : Manual Hook"
          echo "Defconfig    : gale_defconfig"
          echo "Branch       : lineage-22.2"
          echo
          echo "Output:"
          echo "  Image.gz"
          echo "  zauksk-ReSukiSU-gale.zip"
          echo
          echo "=========================================="
