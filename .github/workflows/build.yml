name: Build zauksk - Redmi 13C

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # CHECKOUT MAYURI KERNEL
      # ==========================================
      - name: Clone Mayuri Kernel
        uses: actions/checkout@v4
        with:
          repository: Mayuri-Chan/android_kernel_xiaomi_gale
          ref: lineage-22.2
          fetch-depth: 1
          path: kernel

      # ==========================================
      # DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            python-is-python3 \
            rsync \
            unzip \
            wget \
            zip

      # ==========================================
      # INFORMATION
      # ==========================================
      - name: Kernel information
        working-directory: kernel
        run: |
          echo "======================================"
          echo "        ZAUKSK KERNEL BUILD"
          echo "======================================"

          git log -1 --oneline
          echo

          echo "Defconfig:"
          grep -n "CONFIG_LOCALVERSION" \
            arch/arm64/configs/gale_defconfig || true

          echo
          echo "Kernel:"
          head -n 6 Makefile

      # ==========================================
      # INSTALL RESUKISU
      # ==========================================
      - name: Install ReSukiSU
        working-directory: kernel
        run: |
          set -e

          echo "Installing ReSukiSU..."

          curl -LSs \
            https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh \
            | bash

      # ==========================================
      # VERIFY RESUKISU
      # ==========================================
      - name: Verify ReSukiSU
        working-directory: kernel
        run: |
          echo "Checking ReSukiSU..."

          grep -R \
            "CONFIG_KSU" \
            arch/arm64/configs \
            kernel \
            2>/dev/null || true

      # ==========================================
      # PREPARE CONFIG
      # ==========================================
      - name: Prepare kernel config
        working-directory: kernel
        run: |
          set -e

          mkdir -p out

          echo "Using gale_defconfig"

          make \
            O=out \
            ARCH=arm64 \
            gale_defconfig

          echo
          echo "Applying zauksk configuration..."

          ./scripts/config \
            --file out/.config \
            --set-str CONFIG_LOCALVERSION "-zauksk"

          # ReSukiSU
          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          # Manual Hook untuk kernel 4.19
          if ./scripts/config --help 2>/dev/null | grep -q KSU_MANUAL_HOOK; then
            ./scripts/config \
              --file out/.config \
              --enable CONFIG_KSU_MANUAL_HOOK
          fi

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "======================================"
          echo "KERNEL CONFIG"
          echo "======================================"

          grep -E \
            "CONFIG_LOCALVERSION|CONFIG_KSU" \
            out/.config || true

      # ==========================================
      # BUILD
      # ==========================================
      - name: Build kernel
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip

          echo "======================================"
          echo "BUILDING ZAUKSK"
          echo "======================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1

      # ==========================================
      # CHECK OUTPUT
      # ==========================================
      - name: Check kernel output
        working-directory: kernel
        run: |
          set -e

          echo "======================================"
          echo "BUILD OUTPUT"
          echo "======================================"

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            | sort

          echo

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "SUCCESS: Image.gz found"
          else
            echo "ERROR: Image.gz not found"
            exit 1
          fi

      # ==========================================
      # COLLECT
      # ==========================================
      - name: Prepare artifacts
        working-directory: kernel
        run: |
          set -e

          mkdir -p ../zauksk

          cp \
            out/arch/arm64/boot/Image.gz \
            ../zauksk/

          if [ -d out/arch/arm64/boot/dts ]; then
            cp -r \
              out/arch/arm64/boot/dts \
              ../zauksk/
          fi

          cp \
            out/.config \
            ../zauksk/

          echo "zauksk" \
            > ../zauksk/kernel-name.txt

          echo "Mayuri-Chan/android_kernel_xiaomi_gale" \
            > ../zauksk/source.txt

          echo "lineage-22.2" \
            > ../zauksk/branch.txt

      # ==========================================
      # CREATE ZIP
      # ==========================================
      - name: Create kernel ZIP
        run: |
          cd zauksk

          zip -r \
            ../zauksk-ReSukiSU-gale.zip \
            Image.gz \
            dts \
            .config \
            kernel-name.txt \
            source.txt \
            branch.txt

      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: zauksk-ReSukiSU-gale
          path: |
            zauksk/
            zauksk-ReSukiSU-gale.zip
          if-no-files-found: error

      # ==========================================
      # SUMMARY
      # ==========================================
      - name: Build summary
        run: |
          echo "======================================"
          echo "       BUILD SUCCESS"
          echo "======================================"
          echo
          echo "Device : Redmi 13C / POCO C65"
          echo "Codename : gale / gust"
          echo "Kernel : 4.19"
          echo "Name : zauksk"
          echo "Root : ReSukiSU"
          echo "Config : gale_defconfig"
          echo
          echo "Download artifact:"
          echo "zauksk-ReSukiSU-gale"
          echo "======================================"
