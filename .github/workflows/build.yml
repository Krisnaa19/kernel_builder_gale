name: Build zauksk + ReSukiSU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build zauksk Kernel
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            bc \
            bison \
            flex \
            ccache \
            zip \
            unzip \
            rsync \
            lz4 \
            cpio \
            device-tree-compiler \
            python3 \
            python3-pip \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang \
            llvm \
            lld

      # ============================================================
      # 2. CLONE MAYURI KERNEL
      #
      # IMPORTANT:
      # Do NOT use lineage-22.2 here.
      # The current upstream tree exposes the usable kernel tree
      # through its default/master branch.
      # ============================================================
      - name: Clone Mayuri Kernel
        run: |
          set -eux

          echo "=========================================="
          echo "CLONING MAYURI KERNEL"
          echo "=========================================="

          git clone \
            --depth=1 \
            https://github.com/Mayuri-Chan/android_kernel_xiaomi_gale.git \
            kernel

          cd kernel

          echo "Current branch:"
          git branch --show-current

          echo "Current commit:"
          git log -1 --oneline

          echo "=========================================="
          echo "VERIFY KERNEL TREE"
          echo "=========================================="

          test -f Makefile
          test -f arch/arm64/configs/gale_defconfig

          echo "OK: Makefile found"
          echo "OK: gale_defconfig found"

          echo "Kernel version:"
          make kernelversion

      # ============================================================
      # 3. INSTALL RESUKISU
      # ============================================================
      - name: Install ReSukiSU
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "INSTALL RESUKISU"
          echo "=========================================="

          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash

      # ============================================================
      # 4. VERIFY RESUKISU
      # ============================================================
      - name: Verify ReSukiSU
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "VERIFY RESUKISU"
          echo "=========================================="

          if [ ! -d KernelSU ]; then
            echo "ERROR: KernelSU directory not found"
            exit 1
          fi

          echo "KernelSU directory:"
          ls -la KernelSU

          echo "Searching ReSukiSU/KSU configuration..."

          grep -R "config KSU" -n \
            KernelSU \
            2>/dev/null | head -20 || true

      # ============================================================
      # 5. PREPARE CONFIG
      # ============================================================
      - name: Prepare kernel configuration
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "PREPARE KERNEL CONFIG"
          echo "=========================================="

          test -f arch/arm64/configs/gale_defconfig

          make O=out ARCH=arm64 gale_defconfig

          echo "Initial config created."

          # --------------------------------------------------------
          # Kernel name
          # --------------------------------------------------------
          scripts/config \
            --file out/.config \
            --set-str LOCALVERSION "-zauksk"

          # --------------------------------------------------------
          # ReSukiSU
          # --------------------------------------------------------
          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          # --------------------------------------------------------
          # Manual Hook
          # --------------------------------------------------------
          if grep -Rqs "config KSU_MANUAL_HOOK" KernelSU; then
            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU_MANUAL_HOOK
          else
            echo "WARNING: CONFIG_KSU_MANUAL_HOOK not found."
            echo "Checking Kconfig files..."

            grep -R \
              "KSU_MANUAL_HOOK" \
              KernelSU \
              2>/dev/null || true

            exit 1
          fi

          # Re-resolve dependencies
          make O=out ARCH=arm64 olddefconfig

          echo "=========================================="
          echo "FINAL CONFIG CHECK"
          echo "=========================================="

          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=' \
            out/.config

          echo "=========================================="
          echo "CONFIG CHECK PASSED"
          echo "=========================================="

      # ============================================================
      # 6. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export OBJSIZE=llvm-size
          export STRIP=llvm-strip

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            OBJSIZE=llvm-size \
            STRIP=llvm-strip

          echo "=========================================="
          echo "BUILD FINISHED"
          echo "=========================================="

      # ============================================================
      # 7. VERIFY KERNEL IMAGE
      # ============================================================
      - name: Check kernel
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "CHECK KERNEL IMAGE"
          echo "=========================================="

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Found Image.gz"
            ls -lh out/arch/arm64/boot/Image.gz

          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "Found Image"
            ls -lh out/arch/arm64/boot/Image

          else
            echo "ERROR: Kernel Image not found"
            find out/arch/arm64/boot -maxdepth 2 -type f -print
            exit 1
          fi

      # ============================================================
      # 8. CLONE ANYKERNEL3
      # ============================================================
      - name: Clone AnyKernel3
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          echo "AnyKernel3 ready."

      # ============================================================
      # 9. COPY KERNEL IMAGE
      # ============================================================
      - name: Copy kernel image
        run: |
          set -eux

          rm -f AnyKernel3/zImage
          rm -f AnyKernel3/Image
          rm -f AnyKernel3/Image-dtb
          rm -f AnyKernel3/Image.gz

          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp \
              kernel/out/arch/arm64/boot/Image.gz \
              AnyKernel3/Image.gz

          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp \
              kernel/out/arch/arm64/boot/Image \
              AnyKernel3/Image

          else
            echo "ERROR: No kernel image available"
            exit 1
          fi

          ls -lh AnyKernel3/Image*

      # ============================================================
      # 10. CONFIGURE ANYKERNEL3
      # ============================================================
      - name: Configure AnyKernel3
        run: |
          set -eux

          cd AnyKernel3

          cat > anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ### zauksk + ReSukiSU
          ### Redmi 13C / POCO C65
          ### gale / gust

          properties() { '
          kernel.string=zauksk Kernel - ReSukiSU
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0

          device.name1=gale
          device.name2=gust

          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          # --------------------------------------------------------
          # Boot partition
          # --------------------------------------------------------

          block=auto;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          # --------------------------------------------------------
          # AnyKernel core
          # --------------------------------------------------------

          . tools/ak3-core.sh;

          # --------------------------------------------------------
          # Dump current boot
          # --------------------------------------------------------

          dump_boot;

          # --------------------------------------------------------
          # Replace kernel
          # --------------------------------------------------------

          write_boot;
          EOF

          chmod +x anykernel.sh

          echo "=========================================="
          echo "ANYKERNEL CONFIG"
          echo "=========================================="

          cat anykernel.sh

      # ============================================================
      # 11. ADD BUILD INFORMATION
      # ============================================================
      - name: Add kernel information
        run: |
          set -eux

          cd AnyKernel3

          echo "zauksk Kernel" > version
          echo "ReSukiSU" >> version
          echo "Manual Hook" >> version
          echo "Redmi 13C / POCO C65" >> version
          echo "gale / gust" >> version
          echo "Linux 4.19" >> version

          cat > build-info.txt <<EOF
          Kernel: zauksk
          Root: ReSukiSU
          Hook: Manual Hook
          Device: Redmi 13C / POCO C65
          Codename: gale / gust
          Kernel: Linux 4.19
          Source: Mayuri-Chan/android_kernel_xiaomi_gale
          Defconfig: gale_defconfig
          Architecture: arm64
          EOF

          cat build-info.txt

      # ============================================================
      # 12. CREATE FLASHABLE ZIP
      # ============================================================
      - name: Create flashable ZIP
        run: |
          set -eux

          mkdir -p release

          cd AnyKernel3

          zip -r9 \
            ../release/zauksk-ReSukiSU-gale.zip \
            . \
            -x ".git/*" \
            -x ".gitignore" \
            -x ".github/*"

          cd ..

          echo "=========================================="
          echo "FLASHABLE ZIP CREATED"
          echo "=========================================="

          ls -lh release/zauksk-ReSukiSU-gale.zip

      # ============================================================
      # 13. CHECK ZIP
      # ============================================================
      - name: Verify flashable ZIP
        run: |
          set -eux

          test -f release/zauksk-ReSukiSU-gale.zip

          unzip -t \
            release/zauksk-ReSukiSU-gale.zip

          echo "=========================================="
          echo "ZIP CHECK PASSED"
          echo "=========================================="

      # ============================================================
      # 14. SHA256
      # ============================================================
      - name: Generate checksum
        run: |
          set -eux

          cd release

          sha256sum \
            zauksk-ReSukiSU-gale.zip \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      # ============================================================
      # 15. UPLOAD ONLY ZIP
      # ============================================================
      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zauksk-ReSukiSU-gale-FLASHABLE
          path: |
            release/zauksk-ReSukiSU-gale.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
