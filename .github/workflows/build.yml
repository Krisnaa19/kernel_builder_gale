name: Build Redmi 13C Kernel - zauksk++ ReSukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev libncurses5-dev libssl-dev bc liblz4-tool libelf-dev python3 binutils-aarch64-linux-gnu

      - name: Download AOSP Toolchain (Google Clang r383902)
        run: |
          git clone https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r383902.git --depth=1 clang
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1 gcc64
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 --depth=1 gcc32

      - name: Clone Kernel Source
        run: |
          git clone https://github.com/xxblebleblexx/android_kernel_xiaomi_gale.git --depth=1 kernel-source

      - name: Integrate ReSukiSU (Non-GKI 4.19 Compatible)
        run: |
          cd kernel-source
          
          # Setup ReSukiSU/KernelSU versi kompatibel Non-GKI
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s v0.9.5 || \
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

          DEFCONFIG=$(find arch/arm64/configs/ -name "*gale*defconfig" | head -n 1)
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG="arch/arm64/configs/gale_defconfig"
          fi
          echo "DEFCONFIG_NAME=$(basename $DEFCONFIG)" >> $GITHUB_ENV

          # Aktifkan hook Kprobes untuk Non-GKI
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG

      - name: Compile Kernel
        run: |
          cd kernel-source
          export PATH="${GITHUB_WORKSPACE}/clang/bin:${GITHUB_WORKSPACE}/gcc64/bin:${GITHUB_WORKSPACE}/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"
          export KBUILD_BUILD_USER="zauksk"
          export KBUILD_BUILD_HOST="Builder"
          
          make O=out ARCH=arm64 $DEFCONFIG_NAME
          
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            LOCALVERSION="-zauksk++" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            KCFLAGS="-w" \
            KCPPFLAGS="-w"

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 ak3
          
          sed -i 's/device.name1=.*/device.name1=gale/g' ak3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=gust/g' ak3/anykernel.sh
          sed -i 's|block=.*|block=/dev/block/by-name/boot|g' ak3/anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=auto/g' ak3/anykernel.sh
          
          IMAGE_FILE=$(find kernel-source/out/arch/arm64/boot/ -type f \( -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" \) | head -n 1)
          
          if [ -z "$IMAGE_FILE" ]; then
            echo "Kernel Image tidak ditemukan!"
            exit 1
          fi
          
          cp "$IMAGE_FILE" ak3/$(basename "$IMAGE_FILE")
          cd ak3
          zip -r9 ../Kernel-Redmi13C-zauksk++-ReSukiSU.zip * -x .git README.md *placeholder

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi13C-zauksk++-ReSukiSU
          path: Kernel-Redmi13C-zauksk++-ReSukiSU.zip
          
