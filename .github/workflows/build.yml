name: Build zauksk Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build zauksk + ReSukiSU
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            bc \
            bison \
            flex \
            ccache \
            rsync \
            cpio \
            lz4 \
            device-tree-compiler \
            python3 \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            build-essential

      # ============================================================
      # 2. CLONE MAYURI KERNEL
      # ============================================================
      - name: Clone Mayuri Kernel
        run: |
          set -eux

          echo "=========================================="
          echo "CLONE MAYURI KERNEL"
          echo "=========================================="

          git clone \
            --depth=1 \
            https://github.com/Mayuri-Chan/android_kernel_xiaomi_gale.git \
            kernel

          cd kernel

          echo "Commit:"
          git log -1 --oneline

          echo "Branch:"
          git branch --show-current

          echo "=========================================="
          echo "VERIFY TREE"
          echo "=========================================="

          test -f Makefile
          test -f arch/arm64/configs/gale_defconfig
          test -f build.config.mtk.aarch64

          echo "OK: Makefile"
          echo "OK: gale_defconfig"
          echo "OK: build.config.mtk.aarch64"

          echo "Kernel version:"
          make kernelversion

      # ============================================================
      # 3. INSTALL RESUKISU
      # ============================================================
      - name: Install ReSukiSU
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "INSTALL RESUKISU"
          echo "=========================================="

          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash

          test -d KernelSU

          echo "ReSukiSU / KernelSU directory found."

      # ============================================================
      # 4. DOWNLOAD EXACT CLANG R383902
      # ============================================================
      - name: Install Android Clang r383902
        run: |
          set -eux

          echo "=========================================="
          echo "INSTALL CLANG R383902"
          echo "=========================================="

          mkdir -p "$HOME/toolchains"

          git clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$HOME/toolchains/clang"

          cd "$HOME/toolchains/clang"

          git sparse-checkout set clang-r383902

          test -x clang-r383902/bin/clang
          test -x clang-r383902/bin/ld.lld

          echo "Clang:"
          clang-r383902/bin/clang --version

          echo "LLD:"
          clang-r383902/bin/ld.lld --version

      # ============================================================
      # 5. PREPARE KERNEL CONFIG
      # ============================================================
      - name: Prepare kernel configuration
        working-directory: kernel
        env:
          CLANG_PATH: ${{ env.HOME }}/toolchains/clang/clang-r383902
        run: |
          set -eux

          echo "=========================================="
          echo "PREPARE KERNEL CONFIG"
          echo "=========================================="

          export PATH="$HOME/toolchains/clang/clang-r383902/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          export LLVM=1
          export LLVM_IAS=1

          rm -rf out
          mkdir -p out

          echo "=========================================="
          echo "STEP 1: gale_defconfig"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            LLVM_IAS=1 \
            gale_defconfig

          test -f out/.config

          echo "gale_defconfig generated."

          # --------------------------------------------------------
          # Kernel name
          # --------------------------------------------------------

          scripts/config \
            --file out/.config \
            --set-str LOCALVERSION "-zauksk"

          # --------------------------------------------------------
          # ReSukiSU
          # --------------------------------------------------------

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          # --------------------------------------------------------
          # Manual Hook
          # --------------------------------------------------------

          if grep -Rqs \
            "config KSU_MANUAL_HOOK" \
            KernelSU; then

            echo "CONFIG_KSU_MANUAL_HOOK found."

            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU_MANUAL_HOOK

          else
            echo "ERROR:"
            echo "CONFIG_KSU_MANUAL_HOOK was not found in KernelSU."
            exit 1
          fi

          echo "=========================================="
          echo "CONFIG BEFORE OLDDEFCONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=' \
            out/.config || true

          # --------------------------------------------------------
          # VERY IMPORTANT
          #
          # olddefconfig must be used so Kconfig NEVER asks
          # interactive questions.
          # --------------------------------------------------------

          echo "=========================================="
          echo "RUN OLDDEFCONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          # --------------------------------------------------------
          # Verify generated auto.conf
          # --------------------------------------------------------

          test -f out/include/config/auto.conf

          echo "auto.conf generated successfully."

          # --------------------------------------------------------
          # Prepare generated headers
          # --------------------------------------------------------

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            LLVM_IAS=1 \
            prepare

          test -f out/include/generated/autoconf.h || true

          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_MACH_MT6768=|CONFIG_NR_CPUS=' \
            out/.config || true

          echo "=========================================="
          echo "CONFIGURATION READY"
          echo "=========================================="

      # ============================================================
      # 6. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          export PATH="$HOME/toolchains/clang/clang-r383902/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export OBJSIZE=llvm-size
          export STRIP=llvm-strip

          # --------------------------------------------------------
          # IMPORTANT:
          #
          # Prevent Kbuild from silently entering interactive
          # configuration.
          # --------------------------------------------------------

          export KCONFIG_NOSILENTUPDATE=1

          test -f out/.config
          test -f out/include/config/auto.conf

          echo "Using compiler:"
          clang --version

          echo "=========================================="
          echo "START COMPILE"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            OBJSIZE=llvm-size \
            STRIP=llvm-strip \
            KCONFIG_NOSILENTUPDATE=1 \
            -j"$(nproc)"

          echo "=========================================="
          echo "COMPILE FINISHED"
          echo "=========================================="

      # ============================================================
      # 7. CHECK IMAGE
      # ============================================================
      - name: Check kernel
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "CHECK KERNEL"
          echo "=========================================="

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "FOUND: Image.gz"
            ls -lh out/arch/arm64/boot/Image.gz

          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "FOUND: Image"
            ls -lh out/arch/arm64/boot/Image

          else
            echo "ERROR: Image not found."

            echo "Available boot files:"
            find out/arch/arm64/boot \
              -maxdepth 2 \
              -type f \
              -print

            exit 1
          fi

      # ============================================================
      # 8. CLONE ANYKERNEL3
      # ============================================================
      - name: Clone AnyKernel3
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          test -f AnyKernel3/tools/ak3-core.sh

      # ============================================================
      # 9. COPY IMAGE
      # ============================================================
      - name: Copy kernel image
        run: |
          set -eux

          rm -f AnyKernel3/Image
          rm -f AnyKernel3/Image.gz
          rm -f AnyKernel3/Image-dtb
          rm -f AnyKernel3/zImage

          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then

            cp \
              kernel/out/arch/arm64/boot/Image.gz \
              AnyKernel3/Image.gz

          elif [ -f kernel/out/arch/arm64/boot/Image ]; then

            cp \
              kernel/out/arch/arm64/boot/Image \
              AnyKernel3/Image

          else
            echo "ERROR: no kernel image."
            exit 1
          fi

          ls -lh AnyKernel3/Image*

      # ============================================================
      # 10. CONFIGURE ANYKERNEL3
      # ============================================================
      - name: Configure AnyKernel3
        run: |
          set -eux

          cd AnyKernel3

          cat > anykernel.sh <<'EOF'
          ### AnyKernel3
          ### zauksk + ReSukiSU
          ### Redmi 13C / POCO C65
          ### gale / gust

          properties() { '
          kernel.string=zauksk Kernel - ReSukiSU
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0

          device.name1=gale
          device.name2=gust

          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          block=auto;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;

          write_boot;
          EOF

          chmod +x anykernel.sh

          echo "=========================================="
          echo "ANYKERNEL SCRIPT"
          echo "=========================================="

          cat anykernel.sh

      # ============================================================
      # 11. BUILD INFO
      # ============================================================
      - name: Add build information
        run: |
          set -eux

          cd AnyKernel3

          cat > version <<'EOF'
          zauksk Kernel
          ReSukiSU
          Manual Hook
          Redmi 13C / POCO C65
          gale / gust
          Linux 4.19
          EOF

          cat > build-info.txt <<'EOF'
          Kernel: zauksk
          Root: ReSukiSU
          Hook: Manual Hook
          Device: Redmi 13C / POCO C65
          Codename: gale / gust
          Linux: 4.19
          Defconfig: gale_defconfig
          Architecture: arm64
          Compiler: Android Clang r383902
          Source: Mayuri-Chan/android_kernel_xiaomi_gale
          EOF

          cat build-info.txt

      # ============================================================
      # 12. CREATE ZIP
      # ============================================================
      - name: Create flashable ZIP
        run: |
          set -eux

          mkdir -p release

          cd AnyKernel3

          zip -r9 \
            ../release/zauksk-ReSukiSU-gale.zip \
            . \
            -x ".git/*" \
            -x ".github/*"

          cd ..

          test -f release/zauksk-ReSukiSU-gale.zip

          echo "=========================================="
          echo "FLASHABLE ZIP"
          echo "=========================================="

          ls -lh release/zauksk-ReSukiSU-gale.zip

      # ============================================================
      # 13. VERIFY ZIP
      # ============================================================
      - name: Verify ZIP
        run: |
          set -eux

          unzip -t \
            release/zauksk-ReSukiSU-gale.zip

          echo "ZIP TEST PASSED."

      # ============================================================
      # 14. SHA256
      # ============================================================
      - name: Generate SHA256
        run: |
          set -eux

          cd release

          sha256sum \
            zauksk-ReSukiSU-gale.zip \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      # ============================================================
      # 15. UPLOAD ONLY FLASHABLE ZIP
      # ============================================================
      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zauksk-ReSukiSU-gale-FLASHABLE
          path: |
            release/zauksk-ReSukiSU-gale.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
