name: Build Redmi 13C Kernel - zauksk++ ReSukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: Setup Build Environment (Ubuntu 20.04 Native GCC 9)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y git curl zip bc bison flex build-essential libssl-dev libelf-dev libncurses-dev ccache python3 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Download AOSP Clang (r383902)
        run: |
          mkdir -p clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r383902.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz

      - name: Clone Tree Wulan
        run: |
          git clone https://github.com/Mayuri-Chan/android_kernel_xiaomi_gale.git --depth=1 kernel-source || \
          git clone https://github.com/wulan17/android_kernel_xiaomi_gale.git --depth=1 kernel-source

      - name: Inject ReSukiSU & Source Patches
        run: |
          cd kernel-source

          # 1. Bypass bug FUSE BTAG
          python3 -c '
          import re
          path = "fs/fuse/file.c"
          with open(path, "r") as f:
              content = f.read()
          new_content = re.sub(r"mtk_btag_pidlog_set_pid_pages\s*\([^;]*\);", "/* bypassed mtk_btag */", content)
          with open(path, "w") as f:
              f.write(new_content)
          '

          # 2. Fix bug ret |= pr_info pada sound driver fs15xx
          sed -i 's/ret |= pr_info/pr_info/g' sound/soc/codecs/fs15xx/fs15xx.c 2>/dev/null || true

          # 3. Injeksi ReSukiSU Non-GKI
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s legacy || \
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

          # 4. Matikan semua pemeriksaan abort/Stop pada ReSukiSU
          find drivers/kernelsu KernelSU -type f -name "Kbuild" -exec sed -i 's/$(error.*)/# bypassed error/g' {} + 2>/dev/null || true
          find drivers/kernelsu KernelSU -type f -name "*.mk" -exec sed -i 's/$(error.*)/# bypassed error/g' {} + 2>/dev/null || true

          # 5. Fix static symbol export selinuxfs.c
          sed -i 's/static const struct file_operations sel_handle_status_ops/const struct file_operations sel_handle_status_ops/' security/selinux/selinuxfs.c 2>/dev/null || true
          if ! grep -q "EXPORT_SYMBOL(sel_handle_status_ops);" security/selinux/selinuxfs.c 2>/dev/null; then
            sed -i '/const struct file_operations sel_handle_status_ops = {/,/};/ { /};/ a\EXPORT_SYMBOL(sel_handle_status_ops); }' security/selinux/selinuxfs.c 2>/dev/null || true
          fi

          DEFCONFIG=$(find arch/arm64/configs/ -name "*gale*defconfig" | head -n 1)
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG="arch/arm64/configs/gale_defconfig"
          fi
          echo "DEFCONFIG_NAME=$(basename $DEFCONFIG)" >> $GITHUB_ENV

      - name: Compile Kernel
        run: |
          cd kernel-source
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="zauksk"
          export KBUILD_BUILD_HOST="Builder"

          # 1. Generate base defconfig ke folder out
          make O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            $DEFCONFIG_NAME

          # 2. Suntikkan konfigurasi ReSukiSU langsung ke out/.config agar tidak tertimpa
          sed -i '/CONFIG_LOCKDEP/d' out/.config
          sed -i '/CONFIG_LOCKDEP_SUPPORT/d' out/.config
          sed -i '/CONFIG_PROVE_LOCKING/d' out/.config
          sed -i '/CONFIG_KALLSYMS/d' out/.config
          sed -i '/CONFIG_KSU/d' out/.config

          cat << 'EOF' >> out/.config
          # CONFIG_LOCKDEP is not set
          # CONFIG_PROVE_LOCKING is not set
          CONFIG_KSU=y
          CONFIG_KSU_HOOK_KPROBES=y
          # CONFIG_KSU_HOOK_TRACEPOINT is not set
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF

          # Sinkronisasi config
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          # 3. Eksekusi build kernel
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            LOCALVERSION="-zauksk++" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-w" \
            KCPPFLAGS="-w"

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 ak3

          sed -i 's/device.name1=.*/device.name1=gale/g' ak3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=gust/g' ak3/anykernel.sh
          sed -i 's|block=.*|block=/dev/block/by-name/boot|g' ak3/anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=auto/g' ak3/anykernel.sh

          IMAGE_FILE=$(find kernel-source/out/arch/arm64/boot/ -type f \( -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" \) | head -n 1)

          if [ -z "$IMAGE_FILE" ]; then
            echo "Kernel Image tidak ditemukan!"
            exit 1
          fi

          cp "$IMAGE_FILE" ak3/$(basename "$IMAGE_FILE")
          cd ak3
          zip -r9 ../Kernel-Redmi13C-zauksk++.zip * -x .git README.md *placeholder

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi13C-zauksk++
          path: Kernel-Redmi13C-zauksk++.zip
          
