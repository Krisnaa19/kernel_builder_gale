name: Build #ice bear++ Kernel - MB56

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: xxblebleblexx/android_kernel_xiaomi_gale
          ref: dev
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            cpio \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            rsync \
            zip \
            unzip \
            python3 \
            wget \
            curl \
            git \
            ninja-build

      - name: Install Neutron Clang 23
        run: |
          set -e

          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"

          curl -fL \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o antman

          chmod +x antman

          ./antman -S=03062026
          ./antman --patch=glibc
          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"

      - name: Verify compiler
        run: |
          set -e
          clang --version
          ld.lld --version
          aarch64-linux-gnu-ld --version

      - name: Setup ReSukiSU Manual Hook
        run: |
          set -e

          curl -LSs \
            https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh \
            | bash

      - name: Setup NoMount v2.0.0
        run: |
          set -e

          curl -LSs \
            https://raw.githubusercontent.com/maxsteeel/nomount/v2.0.0/kernel/setup.sh \
            | bash -s v2.0.0

      - name: Prepare MB56 defconfig
        run: |
          set -e

          mkdir -p arch/arm64/configs

          cat > arch/arm64/configs/mb56_defconfig <<'EOF'
          CONFIG_LOCALVERSION="-#ice bear++"
          EOF

          make O=out ARCH=arm64 mb56_defconfig

      - name: Verify required config
        run: |
          set -e

          grep -q '^CONFIG_KSU=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y' out/.config
          grep -q '^CONFIG_NOMOUNT=y' out/.config

          echo "Required config verified."

      - name: Build kernel
        run: |
          set -e

          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

      - name: Verify kernel
        run: |
          set -e

          test -f out/arch/arm64/boot/Image.gz

          test -f out/include/config/kernel.release

          VERSION="$(cat out/include/config/kernel.release)"

          echo "Kernel release: $VERSION"

          test "$VERSION" = "4.19.325-cip136-st20-#ice bear++"

      - name: Prepare AnyKernel3
        run: |
          set -e

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          rm -rf AnyKernel3/.git

          cp out/arch/arm64/boot/Image.gz \
            AnyKernel3/Image.gz

          cat > AnyKernel3/anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          properties() { '
          kernel.string=#ice bear++-gale-kernel by zauksk on telegram
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=gale
          device.name2=gust
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;

          backup_file init.rc;
          replace_string init.rc "cpuctl cpu,timer_slack" "mount cgroup none /dev/cpuctl cpu" "mount cgroup none /dev/cpuctl cpu,timer_slack";

          backup_file init.tuna.rc;
          insert_line init.tuna.rc "nodiratime barrier=0" after "mount_all /fstab.tuna" "\tmount ext4 /dev/block/by-name/userdata /data remount nosuid nodev noatime nodiratime barrier=0";
          append_file init.tuna.rc "bootscript" init.tuna;

          backup_file fstab.tuna;
          patch_fstab fstab.tuna /system ext4 options "noatime,barrier=1" "noatime,nodiratime,barrier=0";
          patch_fstab fstab.tuna /cache ext4 options "barrier=1" "barrier=0,nomblk_io_submit";
          patch_fstab fstab.tuna /data ext4 options "data=ordered" "nomblk_io_submit,data=writeback";
          append_file fstab.tuna "usbdisk" fstab;

          flash_boot;
          EOF

      - name: Create flashable ZIP
        run: |
          set -e

          cd AnyKernel3

          zip -r9 \
            ../#ice-bear++-MB56-gale.zip \
            . \
            -x '*.git*' 'README.md'

      - name: Verify ZIP
        run: |
          set -e

          test -f "#ice-bear++-MB56-gale.zip"

          unzip -t "#ice-bear++-MB56-gale.zip"

          ls -lh "#ice-bear++-MB56-gale.zip"

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ice-bear-MB56-gale
          path: "#ice-bear++-MB56-gale.zip"
