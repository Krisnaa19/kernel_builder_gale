name: Build zauksk Kernel - Redmi 13C

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build zauksk + ReSukiSU
    runs-on: ubuntu-22.04

    env:
      KERNEL_REPO: https://github.com/Mayuri-Chan/android_kernel_xiaomi_gale.git
      KERNEL_BRANCH: lineage-22.2
      DEFCONFIG: gale_defconfig
      KERNEL_NAME: zauksk

    steps:

      # =========================================================
      # DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            python-is-python3 \
            rsync \
            unzip \
            wget \
            zip \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      # =========================================================
      # CLONE MAYURI KERNEL
      # =========================================================

      - name: Clone Mayuri Kernel
        run: |
          set -eux

          echo "=========================================="
          echo "CLONING MAYURI KERNEL"
          echo "=========================================="

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

          cd kernel

          echo
          echo "Commit:"
          git log -1 --oneline

          echo
          echo "Remote:"
          git remote -v

          echo
          echo "Checking defconfig..."

          test -f "arch/arm64/configs/${DEFCONFIG}"

          echo "Found ${DEFCONFIG}"

      # =========================================================
      # INSTALL RESUKISU
      # =========================================================

      - name: Install ReSukiSU
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "INSTALLING RESUKISU"
          echo "=========================================="

          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash

          echo
          echo "ReSukiSU setup finished."

      # =========================================================
      # VERIFY RESUKISU
      # =========================================================

      - name: Verify ReSukiSU
        working-directory: kernel
        run: |
          set -e

          echo "=========================================="
          echo "VERIFY RESUKISU"
          echo "=========================================="

          echo
          echo "Searching KernelSU files..."

          find . \
            -maxdepth 3 \
            \( -iname '*ksu*' -o -iname '*kernelsu*' \) \
            -print \
            | head -100 \
            || true

          echo
          echo "Searching CONFIG_KSU..."

          grep -R \
            "CONFIG_KSU" \
            arch/arm64/configs \
            2>/dev/null \
            || true

      # =========================================================
      # PREPARE KERNEL CONFIG
      # =========================================================

      - name: Prepare kernel configuration
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "PREPARING KERNEL CONFIG"
          echo "=========================================="

          rm -rf out

          mkdir -p out

          echo
          echo "Using:"
          echo "  DEFCONFIG = ${DEFCONFIG}"
          echo "  ARCH      = arm64"

          make \
            O=out \
            ARCH=arm64 \
            "${DEFCONFIG}"

          echo
          echo "Original local version:"

          grep \
            CONFIG_LOCALVERSION \
            out/.config \
            || true

          # -----------------------------------------------------
          # Kernel name
          # -----------------------------------------------------

          echo
          echo "Setting kernel name to ${KERNEL_NAME}"

          ./scripts/config \
            --file out/.config \
            --set-str CONFIG_LOCALVERSION "-${KERNEL_NAME}"

          # -----------------------------------------------------
          # ReSukiSU
          # -----------------------------------------------------

          echo
          echo "Enabling CONFIG_KSU"

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          # -----------------------------------------------------
          # Manual Hook
          # -----------------------------------------------------

          echo
          echo "Checking Manual Hook config..."

          if grep -Rqs \
            "config KSU_MANUAL_HOOK" \
            kernel \
            drivers \
            2>/dev/null; then

            echo "Enabling CONFIG_KSU_MANUAL_HOOK"

            ./scripts/config \
              --file out/.config \
              --enable CONFIG_KSU_MANUAL_HOOK

          else

            echo "KSU_MANUAL_HOOK symbol not found in source."
            echo "Keeping ReSukiSU integration without forcing unknown symbol."

          fi

          # -----------------------------------------------------
          # Sync config
          # -----------------------------------------------------

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_LOCALVERSION|CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK' \
            out/.config \
            || true

      # =========================================================
      # BUILD KERNEL
      # =========================================================

      - name: Build kernel
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "BUILDING ZAUKSK"
          echo "=========================================="

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export OBJSIZE=llvm-size
          export STRIP=llvm-strip

          echo
          echo "Clang:"
          clang --version

          echo
          echo "LLVM:"
          llvm-config --version

          echo
          echo "Starting compilation..."

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu-

      # =========================================================
      # CHECK BUILD
      # =========================================================

      - name: Check kernel
        working-directory: kernel
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING KERNEL"
          echo "=========================================="

          echo
          echo "Boot output:"

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            | sort

          echo

          if [ -f out/arch/arm64/boot/Image.gz ]; then

            echo "Image.gz found."

          elif [ -f out/arch/arm64/boot/Image ]; then

            echo "Image found."

          else

            echo "::error::Kernel Image tidak ditemukan!"
            exit 1

          fi

      # =========================================================
      # PREPARE ANYKERNEL3
      # =========================================================

      - name: Clone AnyKernel3
        run: |
          set -eux

          echo "=========================================="
          echo "CLONING ANYKERNEL3"
          echo "=========================================="

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          cd AnyKernel3

          rm -rf .git

      # =========================================================
      # COPY KERNEL INTO ANYKERNEL3
      # =========================================================

      - name: Copy kernel image
        run: |
          set -eux

          echo "=========================================="
          echo "PREPARING FLASHABLE KERNEL"
          echo "=========================================="

          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then

            cp \
              kernel/out/arch/arm64/boot/Image.gz \
              AnyKernel3/Image.gz

          elif [ -f kernel/out/arch/arm64/boot/Image ]; then

            cp \
              kernel/out/arch/arm64/boot/Image \
              AnyKernel3/Image

          else

            echo "::error::Kernel image tidak ditemukan."
            exit 1

          fi

          echo
          echo "Kernel image:"

          ls -lh \
            AnyKernel3/Image*

      # =========================================================
      # ANYKERNEL3 SCRIPT
      # =========================================================

      - name: Configure AnyKernel3
        run: |
          set -eux

          cat > AnyKernel3/anykernel.sh <<'EOF'
          properties() { '
          kernel.string=zauksk Kernel - ReSukiSU
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0

          device.name1=gale
          device.name2=gust

          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          # =====================================================
          # BOOT PARTITION
          # =====================================================

          block=auto;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          # =====================================================
          # LOAD ANYKERNEL3 CORE
          # =====================================================

          . tools/ak3-core.sh;

          # =====================================================
          # INSTALL KERNEL
          # =====================================================

          dump_boot;

          write_boot;
          EOF

          echo
          echo "=========================================="
          echo "ANYKERNEL3 CONFIG"
          echo "=========================================="

          cat AnyKernel3/anykernel.sh

      # =========================================================
      # ADD VERSION INFORMATION
      # =========================================================

      - name: Add kernel information
        run: |
          set -eux

          cat > AnyKernel3/version <<'EOF'
          zauksk Kernel
          Redmi 13C / POCO C65
          gale / gust
          Linux 4.19
          ReSukiSU Manual Hook
          Mayuri Kernel
          EOF

          cat > AnyKernel3/build-info.txt <<EOF
          Kernel Name : zauksk
          Device      : Redmi 13C / POCO C65
          Codename    : gale / gust
          Kernel      : Linux 4.19
          Root        : ReSukiSU
          Hook        : Manual Hook
          Source      : ${KERNEL_REPO}
          Branch      : ${KERNEL_BRANCH}
          Defconfig   : ${DEFCONFIG}
          EOF

      # =========================================================
      # CREATE FLASHABLE ZIP
      # =========================================================

      - name: Create flashable ZIP
        run: |
          set -eux

          cd AnyKernel3

          rm -f \
            ../zauksk-ReSukiSU-gale.zip

          zip -r9 \
            ../zauksk-ReSukiSU-gale.zip \
            . \
            -x '*.git*' \
            -x 'README.md' \
            -x '*placeholder*'

          cd ..

          echo
          echo "=========================================="
          echo "FLASHABLE ZIP CREATED"
          echo "=========================================="

          ls -lh \
            zauksk-ReSukiSU-gale.zip

      # =========================================================
      # SHA256
      # =========================================================

      - name: Generate checksum
        run: |
          set -eux

          sha256sum \
            zauksk-ReSukiSU-gale.zip \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      # =========================================================
      # UPLOAD FLASHABLE ZIP
      # =========================================================

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zauksk-ReSukiSU-gale-FLASHABLE
          path: |
            zauksk-ReSukiSU-gale.zip
            SHA256SUMS.txt
          if-no-files-found: error

      # =========================================================
      # BUILD SUMMARY
      # =========================================================

      - name: Build summary
        run: |
          echo
          echo "=============================================="
          echo "          ZAUKSK BUILD SUCCESS"
          echo "=============================================="
          echo
          echo "Device       : Redmi 13C / POCO C65"
          echo "Codename     : gale / gust"
          echo "Kernel       : Linux 4.19"
          echo "Kernel name  : zauksk"
          echo "Root         : ReSukiSU"
          echo "Hook         : Manual Hook"
          echo "Defconfig    : gale_defconfig"
          echo "Source       : Mayuri"
          echo "Branch       : lineage-22.2"
          echo
          echo "FLASHABLE:"
          echo "zauksk-ReSukiSU-gale.zip"
          echo
          echo "Install from TWRP / compatible custom recovery."
          echo
          echo "=============================================="
