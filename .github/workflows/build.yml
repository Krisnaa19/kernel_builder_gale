      - name: Inject MultiSU & Patch Configs
        run: |
          cd kernel-source

          # 1. Bypass bug FUSE BTAG
          python3 -c '
          import re
          path = "fs/fuse/file.c"
          with open(path, "r") as f:
              content = f.read()
          new_content = re.sub(r"mtk_btag_pidlog_set_pid_pages\s*\([^;]*\);", "/* bypassed mtk_btag */", content)
          with open(path, "w") as f:
              f.write(new_content)
          '

          # 2. Fix bug ret |= pr_info sound driver fs15xx
          sed -i 's/ret |= pr_info/pr_info/g' sound/soc/codecs/fs15xx/fs15xx.c 2>/dev/null || true

          # 3. Injeksi MultiSU (MKSU)
          curl -LSs "https://raw.githubusercontent.com/5ec1cff/KernelSU/main/kernel/setup.sh" | bash -s main || \
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

          DEFCONFIG=$(find arch/arm64/configs/ -name "*gale*defconfig" | head -n 1)
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG="arch/arm64/configs/gale_defconfig"
          fi
          echo "DEFCONFIG_NAME=$(basename $DEFCONFIG)" >> $GITHUB_ENV

          # 4. Matikan lockdep
          sed -i '/CONFIG_LOCKDEP/d' $DEFCONFIG
          sed -i '/CONFIG_LOCKDEP_SUPPORT/d' $DEFCONFIG
          sed -i '/CONFIG_PROVE_LOCKING/d' $DEFCONFIG
          echo "# CONFIG_LOCKDEP is not set" >> $DEFCONFIG
          echo "# CONFIG_PROVE_LOCKING is not set" >> $DEFCONFIG

          # 5. Konfigurasi KSU + Kprobes untuk 4.19 Non-GKI
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG
          
