name: Build zauksk Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: zauksk + ReSukiSU
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:

      # ============================================================
      # 1. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            bc \
            bison \
            flex \
            ccache \
            rsync \
            cpio \
            lz4 \
            device-tree-compiler \
            python3 \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            build-essential

      # ============================================================
      # 2. CLONE NEW SOURCE TREE
      #
      # SOURCE:
      # xxblebleblexx/android_kernel_xiaomi_gale
      #
      # BRANCH:
      # dev
      # ============================================================
      - name: Clone Moonbeam Kernel
        run: |
          set -eux

          echo "=========================================="
          echo "CLONE MOONBEAM KERNEL"
          echo "=========================================="

          git clone \
            --depth=1 \
            --single-branch \
            --branch dev \
            https://github.com/xxblebleblexx/android_kernel_xiaomi_gale.git \
            kernel

          cd kernel

          echo "Remote:"
          git remote -v

          echo "Branch:"
          git branch --show-current

          echo "Commit:"
          git log -1 --oneline

          echo "=========================================="
          echo "VERIFY TREE"
          echo "=========================================="

          test -f Makefile
          test -f arch/arm64/configs/gale_defconfig
          test -f build.config.mtk.aarch64

          echo "OK: Makefile"
          echo "OK: gale_defconfig"
          echo "OK: build.config.mtk.aarch64"

          echo "=========================================="
          echo "KERNEL VERSION"
          echo "=========================================="

          make kernelversion

      # ============================================================
      # 3. SHOW ORIGINAL BUILD CONFIG
      # ============================================================
      - name: Verify build configuration
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "BUILD.CONFIG.MTK.AARCH64"
          echo "=========================================="

          cat build.config.mtk.aarch64

          echo "=========================================="
          echo "GALE DEFCONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_MACH_MT6768=|CONFIG_ARCH_MTK_PROJECT=|CONFIG_NR_CPUS=|CONFIG_BUILD_ARM64|CONFIG_LTO=|CONFIG_LTO_CLANG=|CONFIG_THINLTO=|CONFIG_CFI_CLANG=|CONFIG_SHADOW_CALL_STACK=' \
            arch/arm64/configs/gale_defconfig

      # ============================================================
      # 4. INSTALL RESUKISU
      # ============================================================
      - name: Install ReSukiSU
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "INSTALL RESUKISU"
          echo "=========================================="

          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash

          echo "=========================================="
          echo "VERIFY RESUKISU"
          echo "=========================================="

          test -d KernelSU

          echo "KernelSU directory exists."

          find KernelSU \
            -maxdepth 2 \
            -type f \
            | head -50

      # ============================================================
      # 5. VERIFY MANUAL HOOK
      # ============================================================
      - name: Verify ReSukiSU Manual Hook
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "SEARCH MANUAL HOOK"
          echo "=========================================="

          grep -R \
            "KSU_MANUAL_HOOK" \
            KernelSU \
            2>/dev/null \
            | head -30 || true

          if grep -Rqs \
            "config KSU_MANUAL_HOOK" \
            KernelSU; then

            echo "OK: CONFIG_KSU_MANUAL_HOOK exists."

          else

            echo "ERROR:"
            echo "CONFIG_KSU_MANUAL_HOOK does not exist in installed ReSukiSU."

            exit 1

          fi

      # ============================================================
      # 6. DOWNLOAD EXACT CLANG R383902
      #
      # Tree build.config.mtk.aarch64 explicitly requests:
      #
      # clang-r383902
      # ============================================================
      - name: Install Clang r383902
        run: |
          set -eux

          echo "=========================================="
          echo "INSTALL ANDROID CLANG R383902"
          echo "=========================================="

          mkdir -p "$HOME/toolchains"

          git clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$HOME/toolchains/clang"

          cd "$HOME/toolchains/clang"

          git sparse-checkout set clang-r383902

          test -x clang-r383902/bin/clang
          test -x clang-r383902/bin/ld.lld

          echo "=========================================="
          echo "CLANG VERSION"
          echo "=========================================="

          clang-r383902/bin/clang --version

          echo "=========================================="
          echo "LLD VERSION"
          echo "=========================================="

          clang-r383902/bin/ld.lld --version

      # ============================================================
      # 7. PREPARE CONFIGURATION
      #
      # IMPORTANT:
      # We NEVER run plain "make" before config is ready.
      # ============================================================
      - name: Prepare kernel configuration
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "PREPARE KERNEL CONFIG"
          echo "=========================================="

          export PATH="$HOME/toolchains/clang/clang-r383902/bin:$PATH"

          export LD_LIBRARY_PATH="$HOME/toolchains/clang/clang-r383902/lib64:${LD_LIBRARY_PATH:-}"

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          export LLVM=1
          export LLVM_IAS=1

          rm -rf out

          mkdir -p out

          echo "=========================================="
          echo "STEP 1: GALE DEFCONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            LLVM_IAS=1 \
            gale_defconfig

          test -f out/.config

          echo "gale_defconfig OK."

          # --------------------------------------------------------
          # Set kernel name
          # --------------------------------------------------------

          scripts/config \
            --file out/.config \
            --set-str LOCALVERSION "-zauksk"

          # --------------------------------------------------------
          # Enable KSU
          # --------------------------------------------------------

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          # --------------------------------------------------------
          # Enable Manual Hook
          # --------------------------------------------------------

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_MANUAL_HOOK

          # --------------------------------------------------------
          # Make sure required KSU dependencies are handled
          # without interactive prompts.
          # --------------------------------------------------------

          echo "=========================================="
          echo "RUN OLDDEFCONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          # --------------------------------------------------------
          # Required generated configuration
          # --------------------------------------------------------

          test -f out/.config
          test -f out/include/config/auto.conf

          echo "=========================================="
          echo "FINAL CONFIG CHECK"
          echo "=========================================="

          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_MACH_MT6768=|CONFIG_ARCH_MTK_PROJECT=|CONFIG_NR_CPUS=' \
            out/.config

          echo "=========================================="
          echo "CONFIG READY"
          echo "=========================================="

      # ============================================================
      # 8. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          export PATH="$HOME/toolchains/clang/clang-r383902/bin:$PATH"

          export LD_LIBRARY_PATH="$HOME/toolchains/clang/clang-r383902/lib64:${LD_LIBRARY_PATH:-}"

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export OBJSIZE=llvm-size
          export STRIP=llvm-strip

          export KCONFIG_NOSILENTUPDATE=1

          test -f out/.config
          test -f out/include/config/auto.conf

          echo "=========================================="
          echo "COMPILER"
          echo "=========================================="

          clang --version
          ld.lld --version

          echo "=========================================="
          echo "START COMPILATION"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            OBJSIZE=llvm-size \
            STRIP=llvm-strip \
            KCONFIG_NOSILENTUPDATE=1 \
            -j"$(nproc)"

          echo "=========================================="
          echo "BUILD FINISHED"
          echo "=========================================="

      # ============================================================
      # 9. CHECK IMAGE
      # ============================================================
      - name: Check kernel image
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "CHECK KERNEL IMAGE"
          echo "=========================================="

          if [ -f out/arch/arm64/boot/Image.gz ]; then

            echo "FOUND: Image.gz"
            ls -lh out/arch/arm64/boot/Image.gz

          elif [ -f out/arch/arm64/boot/Image ]; then

            echo "FOUND: Image"
            ls -lh out/arch/arm64/boot/Image

          else

            echo "ERROR: Kernel image not found."

            find \
              out/arch/arm64/boot \
              -maxdepth 3 \
              -type f \
              -print

            exit 1

          fi

      # ============================================================
      # 10. CLONE ANYKERNEL3
      # ============================================================
      - name: Clone AnyKernel3
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          test -f AnyKernel3/tools/ak3-core.sh

      # ============================================================
      # 11. COPY IMAGE
      # ============================================================
      - name: Copy kernel image
        run: |
          set -eux

          rm -f \
            AnyKernel3/Image \
            AnyKernel3/Image.gz \
            AnyKernel3/Image-dtb \
            AnyKernel3/zImage

          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then

            cp \
              kernel/out/arch/arm64/boot/Image.gz \
              AnyKernel3/Image.gz

          elif [ -f kernel/out/arch/arm64/boot/Image ]; then

            cp \
              kernel/out/arch/arm64/boot/Image \
              AnyKernel3/Image

          else

            echo "ERROR: no kernel image."

            exit 1

          fi

          echo "Kernel image copied:"
          ls -lh AnyKernel3/Image*

      # ============================================================
      # 12. CONFIGURE ANYKERNEL3
      # ============================================================
      - name: Configure AnyKernel3
        run: |
          set -eux

          cd AnyKernel3

          cat > anykernel.sh <<'EOF'
          ### AnyKernel3
          ### zauksk + ReSukiSU
          ### Moonbeam Kernel
          ### Redmi 13C / POCO C65
          ### gale / gust

          properties() { '
          kernel.string=zauksk Kernel - ReSukiSU
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0

          device.name1=gale
          device.name2=gust

          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          block=auto;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;

          write_boot;
          EOF

          chmod +x anykernel.sh

          echo "=========================================="
          echo "ANYKERNEL CONFIG"
          echo "=========================================="

          cat anykernel.sh

      # ============================================================
      # 13. BUILD INFO
      # ============================================================
      - name: Add build information
        run: |
          set -eux

          cd AnyKernel3

          cat > version <<'EOF'
          zauksk Kernel
          ReSukiSU
          Manual Hook
          Moonbeam Kernel
          Redmi 13C / POCO C65
          gale / gust
          Linux 4.19
          EOF

          cat > build-info.txt <<'EOF'
          Kernel: zauksk
          Root: ReSukiSU
          Hook: Manual Hook

          Source:
          https://github.com/xxblebleblexx/android_kernel_xiaomi_gale

          Branch:
          dev

          Kernel:
          Linux 4.19

          Device:
          Redmi 13C / POCO C65

          Codename:
          gale / gust

          Defconfig:
          gale_defconfig

          Architecture:
          arm64

          Compiler:
          Android Clang r383902
          EOF

          cat build-info.txt

      # ============================================================
      # 14. CREATE FLASHABLE ZIP
      # ============================================================
      - name: Create flashable ZIP
        run: |
          set -eux

          mkdir -p release

          cd AnyKernel3

          zip -r9 \
            ../release/zauksk-ReSukiSU-Moonbeam-gale.zip \
            . \
            -x ".git/*" \
            -x ".github/*"

          cd ..

          test -f release/zauksk-ReSukiSU-Moonbeam-gale.zip

          echo "=========================================="
          echo "FLASHABLE ZIP CREATED"
          echo "=========================================="

          ls -lh \
            release/zauksk-ReSukiSU-Moonbeam-gale.zip

      # ============================================================
      # 15. TEST ZIP
      # ============================================================
      - name: Verify ZIP
        run: |
          set -eux

          unzip -t \
            release/zauksk-ReSukiSU-Moonbeam-gale.zip

          echo "ZIP TEST PASSED."

      # ============================================================
      # 16. SHA256
      # ============================================================
      - name: Generate SHA256
        run: |
          set -eux

          cd release

          sha256sum \
            zauksk-ReSukiSU-Moonbeam-gale.zip \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      # ============================================================
      # 17. UPLOAD ONLY ZIP
      # ============================================================
      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zauksk-ReSukiSU-Moonbeam-gale-FLASHABLE
          path: |
            release/zauksk-ReSukiSU-Moonbeam-gale.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
