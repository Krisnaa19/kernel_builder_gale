name: Build #ice bear++ Kernel - CIP136 ST20
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source (Authentic Branch dev)
        uses: actions/checkout@v4
        with:
          repository: Krisnaa19/android_kernel_xiaomi_gale
          ref: dev
          fetch-depth: 1

      - name: Checkout builder repository
        uses: actions/checkout@v4
        with:
          repository: Krisnaa19/kernel_builder_gale
          path: builder

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev libncurses5-dev libncurses-dev \
            python3 python3-pip zip unzip cpio rsync git curl wget pahole

      - name: Install Sakura Clang 24.0.0git
        run: |
          mkdir -p "$GITHUB_WORKSPACE/prebuilts/clang"
          cd "$GITHUB_WORKSPACE/prebuilts/clang"
          git clone --depth=1 https://gitlab.com/cyy_kawa/sakura-clang.git clang-sakura

      - name: Verify Sakura Clang & LLVM Tools
        run: |
          export CLANG="$GITHUB_WORKSPACE/prebuilts/clang/clang-sakura/bin"
          "$CLANG/clang" --version
          "$CLANG/ld.lld" --version

      - name: Verify kernel base
        run: |
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile
          echo -n "CIP: "; cat localversion-cip
          echo -n "ST:  "; cat localversion-st
          echo "Expected base: 4.19.325-cip136-st20"

      - name: Rename kernel to #ice bear++
        run: |
          sed -i \
            's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-#ice bear++"/' \
            arch/arm64/configs/gale_defconfig
          echo "New CONFIG_LOCALVERSION:"
          grep '^CONFIG_LOCALVERSION=' arch/arm64/configs/gale_defconfig

      - name: Prepare kernel config (Exact Moonbeam Replica)
        run: |
          export ARCH=arm64
          export PATH="$GITHUB_WORKSPACE/prebuilts/clang/clang-sakura/bin:$PATH"
          mkdir -p out

          # Gunakan konfigurasi icebear_defconfig dari repo builder
          if [ -f "$GITHUB_WORKSPACE/builder/configs/icebear_defconfig" ]; then
            echo "Memakai configs/icebear_defconfig dari repo builder..."
            cp "$GITHUB_WORKSPACE/builder/configs/icebear_defconfig" arch/arm64/configs/icebear_defconfig
            make O=out ARCH=arm64 CC=clang LD=ld.lld icebear_defconfig
          else
            echo "Memakai gale_defconfig sebagai fallback..."
            make O=out ARCH=arm64 CC=clang LD=ld.lld gale_defconfig
          fi

          # 1. Identitas Nama
          scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-#ice bear++"
          scripts/config --file out/.config --disable CONFIG_LOCALVERSION_AUTO

          # 2. Compiler Optimization & ThinLTO (Sesuai Diff Moonbeam)
          scripts/config --file out/.config --disable CONFIG_LTO_NONE
          scripts/config --file out/.config --enable CONFIG_LTO
          scripts/config --file out/.config --enable CONFIG_THINLTO
          scripts/config --file out/.config --enable CONFIG_LTO_CLANG
          scripts/config --file out/.config --enable CONFIG_RELR
          scripts/config --file out/.config --enable CONFIG_ARCH_SUPPORTS_SHADOW_CALL_STACK

          # 3. Tuning Latensi, CPU, & RCU
          scripts/config --file out/.config --enable CONFIG_RCU_EXPERT
          scripts/config --file out/.config --set-val CONFIG_RCU_FANOUT 64
          scripts/config --file out/.config --set-val CONFIG_RCU_FANOUT_LEAF 16
          scripts/config --file out/.config --enable CONFIG_RCU_BOOST
          scripts/config --file out/.config --set-val CONFIG_RCU_BOOST_DELAY 500
          scripts/config --file out/.config --enable CONFIG_RCU_NOCB_CPU
          scripts/config --file out/.config --disable CONFIG_CPU_ISOLATION

          # 4. Storage I/O Scheduler & TCP Net-Sched
          scripts/config --file out/.config --enable CONFIG_CFQ_GROUP_IOSCHED
          scripts/config --file out/.config --enable CONFIG_DEFAULT_CFQ
          scripts/config --file out/.config --set-str CONFIG_DEFAULT_IOSCHED "cfq"
          scripts/config --file out/.config --enable CONFIG_IOSCHED_BFQ
          scripts/config --file out/.config --enable CONFIG_MQ_IOSCHED_DEADLINE
          scripts/config --file out/.config --enable CONFIG_MQ_IOSCHED_KYBER
          scripts/config --file out/.config --enable CONFIG_DEFAULT_CUBIC
          scripts/config --file out/.config --set-str CONFIG_DEFAULT_TCP_CONG "cubic"
          scripts/config --file out/.config --enable CONFIG_NET_SCH_DEFAULT
          scripts/config --file out/.config --enable CONFIG_DEFAULT_CAKE
          scripts/config --file out/.config --set-str CONFIG_DEFAULT_NET_SCH "cake"

          # 5. MediaTek Engine & Power Allocator Thermal
          scripts/config --file out/.config --enable CONFIG_MTK_PERFMGR_TOUCH_BOOST
          scripts/config --file out/.config --disable CONFIG_THERMAL_GOV_BACKWARD_COMPATIBLE
          scripts/config --file out/.config --disable CONFIG_THERMAL_DEFAULT_GOV_BACKWARD_COMPATIBLE
          scripts/config --file out/.config --enable CONFIG_THERMAL_DEFAULT_GOV_POWER_ALLOCATOR
          scripts/config --file out/.config --enable CONFIG_THERMAL_GOV_POWER_ALLOCATOR
          scripts/config --file out/.config --enable CONFIG_MTK_GED_SUPPORT
          scripts/config --file out/.config --enable CONFIG_ION_SYSTEM_HEAP
          scripts/config --file out/.config --enable CONFIG_ION_CMA_HEAP

          # 6. Stripping Overhead Logging
          scripts/config --file out/.config --disable CONFIG_SCHED_INFO
          scripts/config --file out/.config --disable CONFIG_SCHEDSTATS
          scripts/config --file out/.config --disable CONFIG_SND_VERBOSE_PROCFS
          scripts/config --file out/.config --set-val CONFIG_KASAN_STACK 0

          # 7. Submerged Root & NoMount
          scripts/config --file out/.config --enable CONFIG_KSU
          scripts/config --file out/.config --set-str CONFIG_KSU_FULL_NAME_FORMAT "%TAG_NAME%-%COMMIT_SHA%@%REPO_NAME%"
          scripts/config --file out/.config --enable CONFIG_KSU_MULTI_MANAGER_SUPPORT
          scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK
          scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK
          scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK
          scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK
          scripts/config --file out/.config --enable CONFIG_NOMOUNT

          make O=out ARCH=arm64 CC=clang LD=ld.lld olddefconfig

          echo "=== Verifikasi Nilai Config Kunci ==="
          grep -E 'CONFIG_(LOCALVERSION|CLANG_VERSION|THINLTO|RELR|KSU|NOMOUNT|DEFAULT_IOSCHED|DEFAULT_NET_SCH|THERMAL_DEFAULT_GOV_POWER_ALLOCATOR)' out/.config || true

      - name: Verify kernel version string
        run: |
          VERSION="$(make -s --no-print-directory \
            O=out ARCH=arm64 CC="$GITHUB_WORKSPACE/prebuilts/clang/clang-sakura/bin/clang" kernelrelease \
            | grep -E '^[0-9]' \
            | tr -d '\r\n')"
          echo "Actual:   $VERSION"
          echo "Expected: 4.19.325-cip136-st20-#ice bear++"
          if [ "$VERSION" != "4.19.325-cip136-st20-#ice bear++" ]; then
            echo "ERROR: Kernel version mismatch!"
            exit 1
          fi
          echo "VERSION CHECK: PASS"

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/prebuilts/clang/clang-sakura/bin:$PATH"
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export OBJSIZE=llvm-size
          export STRIP=llvm-strip

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz dtbs

      - name: Verify kernel binary output
        run: |
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            ls -lh out/arch/arm64/boot/Image.gz
          else
            echo "ERROR: out/arch/arm64/boot/Image.gz tidak ditemukan!"
            exit 1
          fi

      - name: Prepare AnyKernel3 (Exact Moonbeam Package)
        run: |
          mkdir -p anykernel
          # Salin modul, biner khusus, dan struktur installer asli Moonbeam
          cp -r "$GITHUB_WORKSPACE/builder/anykernel-mod/"* anykernel/
          chmod -R 755 anykernel/tools/

      - name: Configure AnyKernel3 Banner & String
        run: |
          sed -i 's/kernel.string=.*/kernel.string=#ice bear++ Kernel for Redmi 13C/' anykernel/anykernel.sh
          echo "#ice bear++" > anykernel/banner

      - name: Copy Image.gz to AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image.gz anykernel/Image.gz

      - name: Clean unnecessary files
        run: |
          cd anykernel
          rm -rf .github README.md LICENSE
          echo "=== File AnyKernel yang siap di-pack ==="
          ls -la

      - name: Create flashable ZIP
        run: |
          ZIP_NAME="ice-bear-ReSukiSU-CIP136-ST20-gale.zip"
          cd anykernel
          rm -f "../$ZIP_NAME"
          zip -r9 "../$ZIP_NAME" * -x "*.git*"
          cd ..
          test -f "$ZIP_NAME"
          ls -lh "$ZIP_NAME"

      - name: Generate SHA256
        run: |
          sha256sum ice-bear-ReSukiSU-CIP136-ST20-gale.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ice-bear-ReSukiSU-CIP136-ST20-gale-FLASHABLE
          path: |
            ice-bear-ReSukiSU-CIP136-ST20-gale.zip
            SHA256SUMS.txt

      - name: Complete
        run: |
          echo "========================================"
          echo "BUILD SUCCEEDED - 100% MOONBEAM REPLICA"
          echo "Kernel: 4.19.325-cip136-st20-#ice bear++"
          echo "ZIP:    ice-bear-ReSukiSU-CIP136-ST20-gale.zip"
          echo "========================================"
          
