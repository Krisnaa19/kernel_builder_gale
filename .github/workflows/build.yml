name: zauksk Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT SOURCE
      # ============================================================
      - name: Checkout kernel source
        run: |
          set -e

          git clone --depth=1 \
            --single-branch \
            --branch dev \
            https://github.com/xxblebleblexx/android_kernel_xiaomi_gale.git \
            kernel


      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget \
            zip


      # ============================================================
      # AARCH64 GCC
      # ============================================================
      - name: Install AArch64 GCC
        run: |
          set -e

          sudo apt-get install -y gcc-aarch64-linux-gnu


      # ============================================================
      # CLANG R383902
      # ============================================================
      - name: Install Clang r383902
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/toolchains/clang-r383902"

          cd "$HOME/toolchains/clang-r383902"

          curl -L \
            --retry 5 \
            --retry-all-errors \
            -o clang-r383902.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r383902.tar.gz"

          tar -xzf clang-r383902.tar.gz

          test -x bin/clang
          test -x bin/ld.lld
          test -x bin/llvm-ar
          test -x bin/llvm-nm
          test -x bin/llvm-objcopy
          test -x bin/llvm-objdump
          test -x bin/llvm-size
          test -x bin/llvm-strip

          echo "$HOME/toolchains/clang-r383902/bin" >> "$GITHUB_PATH"


      # ============================================================
      # VERIFY CLANG
      # ============================================================
      - name: Verify Clang
        shell: bash
        run: |
          set -e

          export PATH="$HOME/toolchains/clang-r383902/bin:$PATH"

          export LD_LIBRARY_PATH="$HOME/toolchains/clang-r383902/lib64:${LD_LIBRARY_PATH:-}"

          echo "========================================"
          echo "          CLANG INFORMATION"
          echo "========================================"

          clang --version

          echo
          echo "LLD:"
          ld.lld --version

          echo
          echo "LLVM tools:"
          llvm-ar --version
          llvm-nm --version
          llvm-objcopy --version
          llvm-objdump --version
          llvm-size --version
          llvm-strip --version


      # ============================================================
      # RESUKISU
      # ============================================================
      - name: Setup ReSukiSU
        working-directory: kernel
        shell: bash
        run: |
          set -e

          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash


      # ============================================================
      # NOMOUNT
      # ============================================================
      - name: Setup NoMount
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "          SETUP NOMOUNT"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" \
            | bash -s dev

          echo
          echo "Checking NoMount source..."

          test -d fs/nomount

          echo "NoMount directory found."

          find fs/nomount \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100


      # ============================================================
      # KERNEL CONFIG
      # ============================================================
      - name: Prepare kernel config
        working-directory: kernel
        shell: bash
        run: |
          set -e

          export PATH="$HOME/toolchains/clang-r383902/bin:$PATH"

          export LD_LIBRARY_PATH="$HOME/toolchains/clang-r383902/lib64:${LD_LIBRARY_PATH:-}"

          mkdir -p out

          echo "========================================"
          echo "        RUNNING GALE DEFCONFIG"
          echo "========================================"

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            gale_defconfig


          # ========================================================
          # KERNEL NAME
          # ========================================================

          scripts/config \
            --file out/.config \
            --set-str LOCALVERSION "-zauksk"


          # ========================================================
          # RESUKISU
          # ========================================================

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_MANUAL_HOOK


          # ========================================================
          # NOMOUNT
          # ========================================================

          scripts/config \
            --file out/.config \
            --enable CONFIG_NOMOUNT


          # ========================================================
          # DISABLE LLVM POLLY
          # Clang r383902 does not support the Polly arguments
          # used by the original configuration.
          # ========================================================

          scripts/config \
            --file out/.config \
            --disable CONFIG_LLVM_POLLY


          # ========================================================
          # SYNC CONFIG
          # ========================================================

          echo
          echo "========================================"
          echo "       SYNCHRONIZING KERNEL CONFIG"
          echo "========================================"

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig


          # ========================================================
          # VERIFY CONFIG
          # ========================================================

          echo
          echo "========================================"
          echo "          FINAL CONFIG"
          echo "========================================"

          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_NOMOUNT=|CONFIG_LLVM_POLLY=' \
            out/.config || true


          test -f out/.config

          test -f out/include/config/auto.conf


          grep -q '^CONFIG_KSU=y$' \
            out/.config


          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' \
            out/.config


          grep -q '^CONFIG_NOMOUNT=y$' \
            out/.config


          grep -q '^CONFIG_LOCALVERSION="-zauksk"$' \
            out/.config


          if grep -q '^CONFIG_LLVM_POLLY=y$' out/.config; then
            echo "ERROR: CONFIG_LLVM_POLLY is enabled!"
            exit 1
          fi


          echo
          echo "CONFIG VERIFICATION PASSED."


      # ============================================================
      # VERIFY RESUKISU
      # ============================================================
      - name: Verify ReSukiSU Manual Hook
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "       RESUKISU MANUAL HOOK"
          echo "========================================"

          grep -R \
            "CONFIG_KSU_MANUAL_HOOK" \
            kernel include fs 2>/dev/null \
            | head -30 || true

          grep -q '^CONFIG_KSU=y$' \
            out/.config

          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' \
            out/.config

          echo
          echo "ReSukiSU Manual Hook verification PASSED."


      # ============================================================
      # VERIFY NOMOUNT
      # ============================================================
      - name: Verify NoMount
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "             NOMOUNT"
          echo "========================================"

          test -d fs/nomount

          grep -R \
            "CONFIG_NOMOUNT" \
            fs/nomount fs/Kconfig fs/Makefile \
            2>/dev/null \
            | head -50 || true

          grep -q '^CONFIG_NOMOUNT=y$' \
            out/.config

          echo
          echo "NoMount verification PASSED."


      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        shell: bash
        env:
          KCONFIG_NOSILENTUPDATE: "1"
        run: |
          set -e

          export PATH="$HOME/toolchains/clang-r383902/bin:$PATH"

          export LD_LIBRARY_PATH="$HOME/toolchains/clang-r383902/lib64:${LD_LIBRARY_PATH:-}"

          export ARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export OBJSIZE=llvm-size
          export STRIP=llvm-strip


          echo "========================================"
          echo "          ZAUKSK KERNEL BUILD"
          echo "========================================"

          echo
          echo "Kernel      : Linux 4.19"
          echo "Device      : Redmi 13C / POCO C65"
          echo "Codename    : gale / gust"
          echo "Kernel name : zauksk"
          echo "Root        : ReSukiSU"
          echo "Hook        : Manual Hook"
          echo "NoMount     : ENABLED"
          echo "Polly       : DISABLED"
          echo "Compiler    : Clang r383902"
          echo


          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            OBJSIZE=llvm-size \
            STRIP=llvm-strip


      # ============================================================
      # FIND KERNEL IMAGE
      # ============================================================
      - name: Find kernel image
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "          SEARCHING KERNEL"
          echo "========================================"


          if [ -f out/arch/arm64/boot/Image.gz ]; then

            echo "Found Image.gz"

            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image.gz" \
              >> "$GITHUB_ENV"


          elif [ -f out/arch/arm64/boot/Image ]; then

            echo "Found Image"

            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image" \
              >> "$GITHUB_ENV"


          else

            echo "ERROR: Kernel image not found."

            find out/arch/arm64/boot \
              -maxdepth 2 \
              -type f \
              -print || true

            exit 1

          fi


      # ============================================================
      # VERIFY BUILD
      # ============================================================
      - name: Verify kernel build
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        VERIFYING KERNEL BUILD"
          echo "========================================"

          ls -lah out/arch/arm64/boot/


          echo
          echo "Kernel configuration:"

          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_NOMOUNT=|CONFIG_LLVM_POLLY=' \
            out/.config || true


          echo
          echo "Kernel image:"

          ls -lh "$KERNEL_IMAGE"


          echo
          echo "Kernel build verification PASSED."


      # ============================================================
      # ANYKERNEL3
      # ============================================================
      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3


          # Remove git repository
          rm -rf AnyKernel3/.git


          # Copy kernel image
          cp \
            "kernel/${KERNEL_IMAGE}" \
            AnyKernel3/


      # ============================================================
      # CONFIGURE ANYKERNEL3
      # ============================================================
      - name: Configure AnyKernel3
        shell: bash
        run: |
          set -e

          cd AnyKernel3


          # ========================================================
          # REMOVE FILES THAT ARE NOT NEEDED IN FINAL ZIP
          # ========================================================

          rm -rf .github

          rm -f LICENSE
          rm -f README.md
          rm -f ZAUKSK_BUILD_INFO.txt


          # ========================================================
          # ANYKERNEL SCRIPT
          # ========================================================

          cat > anykernel.sh <<'EOF'
          properties() { '
          kernel.string=zauksk Kernel - ReSukiSU - NoMount
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0

          device.name1=gale
          device.name2=gust

          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          block=auto;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;

          write_boot;
          EOF


          # ========================================================
          # CLEAN UNNECESSARY ROOT FILES
          # Keep only the normal AnyKernel flashing structure.
          # ========================================================

          find . -maxdepth 1 -type f \
            ! -name "META-INF" \
            ! -name "anykernel.sh" \
            ! -name "banner" \
            ! -name "Image.gz" \
            ! -name "Image" \
            -delete


          # ========================================================
          # VERIFY FINAL STRUCTURE
          # ========================================================

          echo
          echo "========================================"
          echo "       ANYKERNEL3 FINAL STRUCTURE"
          echo "========================================"

          find . -maxdepth 2 -print | sort


          # Required files/directories
          test -d META-INF
          test -d tools
          test -f anykernel.sh


          if [ -f Image.gz ]; then
            echo "Image.gz found."
          elif [ -f Image ]; then
            echo "Image found."
          else
            echo "ERROR: Kernel image missing."
            exit 1
          fi


          echo
          echo "AnyKernel3 structure verification PASSED."


      # ============================================================
      # CREATE FLASHABLE ZIP
      # ============================================================
      - name: Create flashable ZIP
        shell: bash
        run: |
          set -e

          cd AnyKernel3


          rm -f \
            ../zauksk-ReSukiSU-gale.zip \
            ../SHA256SUMS.txt


          echo "========================================"
          echo "       CREATING FLASHABLE ZIP"
          echo "========================================"


          zip -r9 \
            ../zauksk-ReSukiSU-gale.zip \
            META-INF \
            modules \
            patch \
            ramdisk \
            tools \
            anykernel.sh \
            banner \
            Image.gz \
            2>/dev/null || true


          # If Image.gz was not present, use Image.
          if [ ! -f ../zauksk-ReSukiSU-gale.zip ]; then
            zip -r9 \
              ../zauksk-ReSukiSU-gale.zip \
              META-INF \
              modules \
              patch \
              ramdisk \
              tools \
              anykernel.sh \
              banner \
              Image
          fi


          cd ..


          # ========================================================
          # SHA256
          # ========================================================

          sha256sum \
            zauksk-ReSukiSU-gale.zip \
            > SHA256SUMS.txt


          echo
          echo "========================================"
          echo "           FINAL ZIP"
          echo "========================================"

          ls -lh zauksk-ReSukiSU-gale.zip

          echo
          echo "SHA256:"
          cat SHA256SUMS.txt


      # ============================================================
      # VALIDATE ZIP
      # ============================================================
      - name: Validate final ZIP
        shell: bash
        run: |
          set -e

          test -f zauksk-ReSukiSU-gale.zip


          echo "========================================"
          echo "        ZIP CONTENTS"
          echo "========================================"

          unzip -l \
            zauksk-ReSukiSU-gale.zip


          echo
          echo "========================================"
          echo "          ZIP TEST"
          echo "========================================"

          unzip -t \
            zauksk-ReSukiSU-gale.zip


          echo
          echo "========================================"
          echo "       FINAL ZIP VALIDATED"
          echo "========================================"


      # ============================================================
      # CHECK NO UNWANTED FILES
      # ============================================================
      - name: Check clean ZIP
        shell: bash
        run: |
          set -e

          echo "Checking ZIP for unwanted repository files..."


          if unzip -l zauksk-ReSukiSU-gale.zip \
            | grep -E \
            '(^|/)(\.github|README\.md|LICENSE|ZAUKSK_BUILD_INFO\.txt)'; then

            echo "ERROR: Unwanted files found in ZIP."

          
