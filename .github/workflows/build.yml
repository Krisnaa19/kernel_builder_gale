name: Build #ice bear++ Kernel - CIP136 ST20

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: xxblebleblexx/android_kernel_xiaomi_gale
          ref: dev
          fetch-depth: 1

      - name: Checkout builder repository
        uses: actions/checkout@v4
        with:
          repository: Krisnaa19/kernel_builder_gale
          path: builder

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev libncurses5-dev libncurses-dev \
            python3 python3-pip zip unzip cpio rsync git curl wget pahole \
            lsb-release software-properties-common gnupg
            
      - name: Install AArch64 GCC
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install LLVM Clang 24 Resmi
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 24 all
          sudo ln -sf /usr/bin/clang-24 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-24 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-24 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-24 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-24 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-24 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-size-24 /usr/bin/llvm-size
          sudo ln -sf /usr/bin/llvm-strip-24 /usr/bin/llvm-strip

      - name: Verify Clang
        run: |
          clang --version
          ld.lld --version
          llvm-ar --version
          llvm-nm --version
          llvm-objcopy --version
          llvm-objdump --version
          llvm-size --version
          llvm-strip --version

      - name: Verify kernel base
        run: |
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile
          echo "CIP:"
          cat localversion-cip || true
          echo "ST:"
          cat localversion-st || true
          echo "Expected base version:"
          echo "4.19.325-cip136-st20"

      - name: Setup ReSukiSU
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash

      - name: Setup NoMount
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/maxsteeel/nomount/v2.0.0/kernel/setup.sh" \
            | bash -s v2.0.0

      - name: Rename kernel to #ice bear++
        run: |
          echo "Original CONFIG_LOCALVERSION:"
          grep '^CONFIG_LOCALVERSION=' arch/arm64/configs/gale_defconfig || true
          sed -i \
            's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-#ice bear++"/' \
            arch/arm64/configs/gale_defconfig
          echo "New CONFIG_LOCALVERSION:"
          grep '^CONFIG_LOCALVERSION=' arch/arm64/configs/gale_defconfig
          # Sync Moonbeam-style scheduler config
          sed -i '/^CONFIG_DEFAULT_MQ_IOSCHED_ADIOS=y$/d' arch/arm64/configs/gale_defconfig
          sed -i '/^CONFIG_MQ_IOSCHED_ADIOS=y$/d' arch/arm64/configs/gale_defconfig
          grep -q '^CONFIG_MQ_IOSCHED_SSG=y$' arch/arm64/configs/gale_defconfig || echo 'CONFIG_MQ_IOSCHED_SSG=y' >> arch/arm64/configs/gale_defconfig
          grep -q '^CONFIG_MQ_IOSCHED_SSG_CGROUP=y$' arch/arm64/configs/gale_defconfig || echo 'CONFIG_MQ_IOSCHED_SSG_CGROUP=y' >> arch/arm64/configs/gale_defconfig
          grep -q '^CONFIG_NET_SCH_CAKE=y$' arch/arm64/configs/gale_defconfig || echo 'CONFIG_NET_SCH_CAKE=y' >> arch/arm64/configs/gale_defconfig
          echo "Scheduler config:"
          grep -E 'CONFIG_(MQ_IOSCHED_ADIOS|MQ_IOSCHED_SSG|MQ_IOSCHED_SSG_CGROUP|NET_SCH_CAKE)' arch/arm64/configs/gale_defconfig || true
          echo -n "CIP = "
          cat localversion-cip || true
          echo -n "ST  = "
          cat localversion-st || true

      - name: Prepare kernel config
        run: |
          export ARCH=arm64
          mkdir -p out
          make O=out ARCH=arm64 gale_defconfig
          scripts/config --file out/.config \
            --enable CONFIG_KSU
          scripts/config --file out/.config \
            --enable CONFIG_KSU_MANUAL_HOOK
          scripts/config --file out/.config \
            --enable CONFIG_NOMOUNT
          scripts/config --file out/.config \
            --disable CONFIG_LLVM_POLLY
          scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-#ice bear++"
          scripts/config --file out/.config \
            --disable CONFIG_LOCALVERSION_AUTO
          make O=out ARCH=arm64 olddefconfig
          echo "=== Final scheduler configuration ==="
          grep -E 'CONFIG_(MQ_IOSCHED_ADIOS|MQ_IOSCHED_SSG|MQ_IOSCHED_SSG_CGROUP|NET_SCH_CAKE)' out/.config || true
          echo "=== Final kernel configuration ==="
          grep -E \
            'CONFIG_(LOCALVERSION|LOCALVERSION_AUTO|KSU|KSU_MANUAL_HOOK|NOMOUNT|LLVM_POLLY)' \
            out/.config || true
          echo "=== Kernel release ==="
          make -s --no-print-directory \
            O=out ARCH=arm64 kernelrelease

      - name: Verify ReSukiSU Manual Hook
        run: |
          grep -q '^CONFIG_KSU=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config
          echo "ReSukiSU Manual Hook: OK"

      - name: Verify NoMount
        run: |
          test -d fs/nomount
          grep -q '^CONFIG_NOMOUNT=y' out/.config
          echo "NoMount: OK"

      - name: Verify kernel version string
        run: |
          VERSION="$(make -s --no-print-directory \
            O=out ARCH=arm64 kernelrelease \
            | grep -E '^[0-9]' \
            | tr -d '\r\n')"
          echo "Actual:"
          echo "$VERSION"
          echo "Expected:"
          echo "4.19.325-cip136-st20-#ice bear++"
          if [ "$VERSION" != "4.19.325-cip136-st20-#ice bear++" ]; then
            echo "ERROR: Kernel version mismatch!"
            echo "Actual: $VERSION"
            exit 1
          fi
          echo "VERSION CHECK: PASS"

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export OBJSIZE=llvm-size
          export STRIP=llvm-strip
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz dtbs

      - name: Find kernel image
        run: |
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz Image.gz
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image Image
          else
            echo "ERROR: Kernel image not found!"
            find out/arch/arm64/boot \
              -maxdepth 2 \
              -type f \
              -print
            exit 1
          fi

      - name: Verify kernel build
        run: |
          echo "=== Kernel release ==="
          make -s --no-print-directory \
            O=out ARCH=arm64 kernelrelease
          echo "=== Kernel version ==="
          make -s --no-print-directory \
            O=out ARCH=arm64 kernelversion
          echo "=== Kernel image ==="
          ls -lh Image* 2>/dev/null || true
          echo "=== Important config ==="
          grep -E \
            'CONFIG_(LOCALVERSION|LOCALVERSION_AUTO|KSU|KSU_MANUAL_HOOK|NOMOUNT|LLVM_POLLY)' \
            out/.config || true

      - name: Prepare AnyKernel3 (Moonbeam Repo)
        run: |
          if [ -d "$GITHUB_WORKSPACE/builder/anykernel-mod" ]; then
            cp -r "$GITHUB_WORKSPACE/builder/anykernel-mod" anykernel
          elif [ -d "$GITHUB_WORKSPACE/builder/anykernel" ]; then
            cp -r "$GITHUB_WORKSPACE/builder/anykernel" anykernel
          else
            echo "ERROR: Folder AnyKernel3 hasil bongkaran Moonbeam tidak ditemukan di repo builder!"
            exit 1
          fi
          chmod -R 755 anykernel/

      - name: Copy kernel to AnyKernel3
        run: |
          if [ -f Image.gz ]; then
            cp Image.gz anykernel/Image.gz
          elif [ -f Image ]; then
            cp Image anykernel/Image
          else
            echo "ERROR: Image/Image.gz missing"
            exit 1
          fi

      - name: Clean AnyKernel3 package
        run: |
          cd anykernel
          rm -rf .github
          rm -f LICENSE
          rm -f README.md
          rm -f ZAUKSK_BUILD_INFO.txt
          echo "=== Final AnyKernel3 files ==="
          find . -maxdepth 2 -type f | sort

      - name: Create flashable ZIP
        run: |
          ZIP_NAME="ice-bear-ReSukiSU-CIP136-ST20-gale.zip"
          cd anykernel
          rm -f "../$ZIP_NAME"
          FILES=(
            "META-INF"
            "modules"
            "patch"
            "ramdisk"
            "tools"
            "anykernel.sh"
            "banner"
          )
          if [ -f Image.gz ]; then
            FILES+=("Image.gz")
          elif [ -f Image ]; then
            FILES+=("Image")
          else
            echo "ERROR: Image/Image.gz missing"
            exit 1
          fi
          zip -r9 "../$ZIP_NAME" "${FILES[@]}"
          cd ..
          test -f "$ZIP_NAME"
          echo "=== Flashable ZIP ==="
          ls -lh "$ZIP_NAME"

      - name: Validate final ZIP
        run: |
          ZIP="ice-bear-ReSukiSU-CIP136-ST20-gale.zip"
          test -f "$ZIP"
          echo "=== ZIP contents ==="
          unzip -l "$ZIP"
          echo "=== Required files ==="
          unzip -l "$ZIP" | grep -E \
            'META-INF/|modules/|patch/|ramdisk/|tools/|anykernel.sh|banner|Image.gz|Image'
          echo "ZIP VALIDATION: PASS"

      - name: Generate SHA256
        run: |
          sha256sum \
            ice-bear-ReSukiSU-CIP136-ST20-gale.zip \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ice-bear-ReSukiSU-CIP136-ST20-gale-FLASHABLE
          path: |
            ice-bear-ReSukiSU-CIP136-ST20-gale.zip
            SHA256SUMS.txt

      - name: Complete
        run: |
          echo "========================================"
          echo "BUILD SUCCESS"
          echo "========================================"
          echo "Kernel:"
          make -s --no-print-directory \
            O=out ARCH=arm64 kernelrelease
          echo "Expected:"
          echo "4.19.325-cip136-st20-#ice bear++"
          echo "ZIP:"
          echo "ice-bear-ReSukiSU-CIP136-ST20-gale.zip"
          echo "========================================"
          
