name: Build #ice bear++ Kernel - Ice Bear

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # CHECKOUT KERNEL SOURCE
      # ============================================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: xxblebleblexx/android_kernel_xiaomi_gale
          ref: dev
          fetch-depth: 1

      # ============================================================
      # CHECKOUT BUILDER FILES
      # ============================================================
      - name: Checkout builder files
        uses: actions/checkout@v4
        with:
          repository: Krisnaa19/kernel_builder_gale
          ref: main
          path: builder
          fetch-depth: 1

      # ============================================================
      # INSTALL Ice Bear DEFCONFIG
      # ============================================================
      - name: Install Ice Bear defconfig
        run: |
          set -e
          test -f builder/configs/icebear_defconfig
          cp builder/configs/icebear_defconfig \
            arch/arm64/configs/icebear_defconfig
          grep '^CONFIG_LOCALVERSION=' \
            arch/arm64/configs/icebear_defconfig

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            cpio \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libncurses-dev \
            dwarves \
            pahole \
            rsync \
            zip \
            unzip \
            python3 \
            wget \
            curl \
            git \
            ninja-build \
            patchelf \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      # ============================================================
      # INSTALL NEUTRON CLANG 23
      # ============================================================
      - name: Install Neutron Clang 23
        run: |
          set -e
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"

          curl -fL \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o antman

          chmod +x antman

          ./antman -S=03062026
          ./antman --patch=glibc

          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"

      # ============================================================
      # VERIFY TOOLCHAIN
      # ============================================================
      - name: Verify toolchain
        run: |
          set -e
          clang --version
          ld.lld --version
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-ld --version
          arm-linux-gnueabi-gcc --version
          arm-linux-gnueabi-ld --version

      # ============================================================
      # SETUP RESUKISU MANUAL HOOK
      # ============================================================
      - name: Setup ReSukiSU Manual Hook
        run: |
          set -e
          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash

      # ============================================================
      # SETUP NOMOUNT V2.0.0
      # ============================================================
      - name: Setup NoMount v2.0.0
        run: |
          set -e
          curl -LSs \
            "https://raw.githubusercontent.com/maxsteeel/nomount/v2.0.0/kernel/setup.sh" \
            | bash -s v2.0.0

      # ============================================================
      # PREPARE KERNEL CONFIG
      # ============================================================
      - name: Prepare Ice Bear kernel config
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export OBJSIZE=llvm-size
          export STRIP=llvm-strip

          mkdir -p out

          make O=out ARCH=arm64 icebear_defconfig
          make O=out ARCH=arm64 olddefconfig

          echo "Kernel release:"
          make O=out ARCH=arm64 kernelrelease

      # ============================================================
      # VERIFY Ice Bear CONFIG
      # ============================================================
      - name: Verify Ice Bear config
        run: |
          set -e

          grep -q '^CONFIG_KSU=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y' out/.config
          grep -q '^CONFIG_NOMOUNT=y' out/.config
          grep -q '^CONFIG_THINLTO=y' out/.config
          grep -q '^CONFIG_LLVM_POLLY=y' out/.config
          grep -q '^CONFIG_LOCALVERSION="-#ice bear++"' \
            arch/arm64/configs/icebear_defconfig

          echo "Ice Bear + ReSukiSU Manual Hook + NoMount + ThinLTO verified."

      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export OBJSIZE=llvm-size
          export STRIP=llvm-strip

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LTO=thin \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            Image.gz \
            dtbs

      # ============================================================
      # VERIFY EXACT KERNEL VERSION
      # ============================================================
      - name: Verify exact kernel version
        run: |
          set -e

          VERSION="$(make -s O=out ARCH=arm64 kernelrelease)"

          echo "Kernel release: $VERSION"

          test "$VERSION" = "4.19.325-cip136-st20-#ice bear++"
          test -f out/include/config/kernel.release
          test "$(cat out/include/config/kernel.release)" = "$VERSION"

      # ============================================================
      # VERIFY KERNEL IMAGE
      # ============================================================
      - name: Verify kernel image
        run: |
          set -e

          test -f out/arch/arm64/boot/Image.gz

          echo "Image.gz:"
          ls -lh out/arch/arm64/boot/Image.gz

          echo "DTBs:"
          find out/arch/arm64/boot/dts \
            -type f \
            -name "*.dtb" \
            -print

      # ============================================================
      # CLONE ANYKERNEL3
      # ============================================================
      - name: Clone AnyKernel3
        run: |
          set -e

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

      # ============================================================
      # CONFIGURE ANYKERNEL3
      # ============================================================
      - name: Configure AnyKernel3
        run: |
          set -e

          cat > AnyKernel3/anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=#ice bear++-gale-kernel by zauksk on telegram
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=gale
          device.name2=gust
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties


          ### AnyKernel install
          ## boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          dump_boot; # use split_boot to skip ramdisk unpack, e.g. for devices with init_boot ramdisk

          # init.rc
          backup_file init.rc;
          replace_string init.rc "cpuctl cpu,timer_slack" "mount cgroup none /dev/cpuctl cpu" "mount cgroup none /dev/cpuctl cpu,timer_slack";

          # init.tuna.rc
          backup_file init.tuna.rc;
          insert_line init.tuna.rc "nodiratime barrier=0" after "mount_all /fstab.tuna" "\tmount ext4 /dev/block/by-name/userdata /data remount nosuid nodev noatime nodiratime barrier=0";
          append_file init.tuna.rc "bootscript" init.tuna;

          # fstab.tuna
          backup_file fstab.tuna;
          patch_fstab fstab.tuna /system ext4 options "noatime,barrier=1" "noatime,nodiratime,barrier=0";
          patch_fstab fstab.tuna /cache ext4 options "barrier=1" "barrier=0,nomblk_io_submit";
          patch_fstab fstab.tuna /data ext4 options "data=ordered" "nomblk_io_submit,data=writeback";
          append_file fstab.tuna "usbdisk" fstab;

          flash_boot; # NÃO faz repack do ramdisk, apenas atualiza kernel


          ## init_boot files attributes
          #init_boot_attributes() {
          #set_perm_recursive 0 0 755 644 $RAMDISK/*;
          #set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          #} # end attributes

          # init_boot shell variables
          #BLOCK=init_boot;
          #IS_SLOT_DEVICE=1;
          #RAMDISK_COMPRESSION=auto;
          #PATCH_VBMETA_FLAG=auto;

          # reset for init_boot patching
          #reset_ak;

          # init_boot install
          #dump_boot; # unpack ramdisk since it is the new first stage init ramdisk where overlay.d must go

          #write_boot;
          ## end init_boot install


          ## vendor_kernel_boot shell variables
          #BLOCK=vendor_kernel_boot;
          #IS_SLOT_DEVICE=1;
          #RAMDISK_COMPRESSION=auto;
          #PATCH_VBMETA_FLAG=auto;

          # reset for vendor_kernel_boot patching
          #reset_ak;
          
          # vendor_kernel_boot install
          #split_boot; # skip unpack/repack ramdisk, e.g. for dtb on devices with hdr v4 and vendor_kernel_boot

          #flash_boot;
          ## end vendor_kernel_boot install


          ## vendor_boot files attributes
          #vendor_boot_attributes() {
          #set_perm_recursive 0 0 755 644 $RAMDISK/*;
          #set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          #} # end attributes

          # vendor_boot shell variables
          #BLOCK=vendor_boot;
          #IS_SLOT_DEVICE=1;
          #RAMDISK_COMPRESSION=auto;
          #PATCH_VBMETA_FLAG=auto;

          # reset for vendor_boot patching
          #reset_ak;

          # vendor_boot install
          #dump_boot; # use split_boot to skip ramdisk unpack, e.g. for dtb on devices with hdr v4 and no vendor_boot

          #write_boot; # use flash_boot to skip ramdisk repack, e.g. for dtb on devices with hdr v4 and no vendor_boot
          ## end vendor_boot install
          EOF

      # ============================================================
      # COPY KERNEL IMAGE
      # ============================================================
      - name: Copy kernel image
        run: |
          set -e

          cp out/arch/arm64/boot/Image.gz \
            AnyKernel3/Image.gz

      # ============================================================
      # PREPARE ANYKERNEL3
      # ============================================================
      - name: Prepare AnyKernel3
        run: |
          set -e

          mkdir -p AnyKernel3/modules
          mkdir -p AnyKernel3/patch
          mkdir -p AnyKernel3/ramdisk

          touch AnyKernel3/modules/.placeholder
          touch AnyKernel3/patch/.placeholder
          touch AnyKernel3/ramdisk/.placeholder

          rm -rf AnyKernel3/.git
          rm -rf AnyKernel3/.github

          rm -f AnyKernel3/LICENSE
          rm -f AnyKernel3/README.md

      # ============================================================
      # CREATE FLASHABLE ZIP
      # ============================================================
      - name: Create flashable ZIP
        run: |
          set -e

          cd AnyKernel3

          zip -r9 \
            ../ice-bear-gale.zip \
            . \
            -x '*.git*' \
            -x 'README.md' \
            -x 'LICENSE'

          cd ..

          test -f "ice-bear-gale.zip"
          ls -lh "ice-bear-gale.zip"

      # ============================================================
      # VERIFY ZIP
      # ============================================================
      - name: Verify ZIP
        run: |
          set -e

          unzip -t "ice-bear-gale.zip"

      # ============================================================
      # UPLOAD FLASHABLE ZIP
      # ============================================================
      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ice-bear-gale-FLASHABLE
          path: "ice-bear-gale.zip"
          if-no-files-found: error
