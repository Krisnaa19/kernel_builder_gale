name: Build zauksk Kernel - CIP136 ST20

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: xxblebleblexx/android_kernel_xiaomi_gale
          ref: dev
          fetch-depth: 1

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            python3 \
            python3-pip \
            zip \
            unzip \
            cpio \
            rsync \
            git \
            curl \
            wget \
            pahole

      # ============================================================
      # GCC AARCH64
      # ============================================================
      - name: Install AArch64 GCC
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # ============================================================
      # CLANG R383902
      # ============================================================
      - name: Install Clang r383902
        run: |
          mkdir -p "$GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86"

          cd "$GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86"

          curl -L --retry 5 --retry-delay 3 \
            -o clang-r383902.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r383902.tar.gz"

          mkdir -p clang-r383902
          tar -xzf clang-r383902.tar.gz -C clang-r383902

          rm -f clang-r383902.tar.gz

      # ============================================================
      # VERIFY CLANG
      # ============================================================
      - name: Verify Clang
        run: |
          export CLANG="$GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86/clang-r383902/bin"

          "$CLANG/clang" --version
          "$CLANG/ld.lld" --version
          "$CLANG/llvm-ar" --version
          "$CLANG/llvm-nm" --version
          "$CLANG/llvm-objcopy" --version
          "$CLANG/llvm-objdump" --version
          "$CLANG/llvm-size" --version
          "$CLANG/llvm-strip" --version

      # ============================================================
      # SHOW KERNEL BASE VERSION
      # ============================================================
      - name: Verify kernel base
        run: |
          echo "=========================================="
          echo "Kernel base version:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile
          echo

          echo "CIP version:"
          cat localversion-cip
          echo

          echo "ST version:"
          cat localversion-st
          echo "=========================================="

      # ============================================================
      # SETUP RESUKISU
      # ============================================================
      - name: Setup ReSukiSU
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash

      # ============================================================
      # SETUP NOMOUNT V2
      # ============================================================
      - name: Setup NoMount
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" \
            | bash -s dev

      # ============================================================
      # PREPARE CONFIG
      # ============================================================
      - name: Prepare kernel config
        run: |
          export ARCH=arm64

          mkdir -p out

          make O=out ARCH=arm64 gale_defconfig

          # --------------------------------------------------------
          # ReSukiSU
          # --------------------------------------------------------
          scripts/config --file out/.config \
            --enable CONFIG_KSU

          scripts/config --file out/.config \
            --enable CONFIG_KSU_MANUAL_HOOK

          # --------------------------------------------------------
          # NoMount
          # --------------------------------------------------------
          scripts/config --file out/.config \
            --enable CONFIG_NOMOUNT

          # --------------------------------------------------------
          # Kernel name
          #
          # localversion-cip = -cip136
          # localversion-st  = -st20
          # CONFIG_LOCALVERSION = -zauksk
          #
          # Expected:
          # 4.19.325-cip136-st20-zauksk
          # --------------------------------------------------------
          scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-zauksk"

          # Jangan tambahkan +git hash ke versi kernel
          scripts/config --file out/.config \
            --disable CONFIG_LOCALVERSION_AUTO

          # --------------------------------------------------------
          # Disable LLVM Polly
          #
          # Clang r383902 tidak kompatibel dengan Polly option
          # dari tree ini.
          # --------------------------------------------------------
          scripts/config --file out/.config \
            --disable CONFIG_LLVM_POLLY

          # --------------------------------------------------------
          # Sync configuration
          # --------------------------------------------------------
          make O=out ARCH=arm64 olddefconfig

          echo
          echo "=========================================="
          echo "IMPORTANT CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_(KSU|KSU_MANUAL_HOOK|NOMOUNT|LOCALVERSION|LOCALVERSION_AUTO|LLVM_POLLY)' \
            out/.config || true

          echo
          echo "Expected kernel version:"
          make O=out ARCH=arm64 kernelversion

          echo
          echo "Full kernel release:"
          make O=out ARCH=arm64 kernelrelease

          echo "=========================================="

      # ============================================================
      # VERIFY RESUKISU
      # ============================================================
      - name: Verify ReSukiSU Manual Hook
        run: |
          echo "Checking ReSukiSU..."

          grep -q '^CONFIG_KSU=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config

          echo "ReSukiSU Manual Hook: OK"

      # ============================================================
      # VERIFY NOMOUNT
      # ============================================================
      - name: Verify NoMount
        run: |
          echo "Checking NoMount..."

          test -d fs/nomount
          grep -q '^CONFIG_NOMOUNT=y' out/.config

          echo "NoMount: OK"

      # ============================================================
      # VERIFY VERSION
      # ============================================================
      - name: Verify kernel version string
        run: |
          VERSION="$(make O=out ARCH=arm64 kernelrelease)"

          echo "Kernel release:"
          echo "$VERSION"

          echo
          echo "Expected:"
          echo "4.19.325-cip136-st20-zauksk"

          case "$VERSION" in
            4.19.325-cip136-st20-zauksk)
              echo
              echo "VERSION CHECK: PASS"
              ;;
            *)
              echo
              echo "VERSION CHECK: FAILED"
              exit 1
              ;;
          esac

      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86/clang-r383902/bin:$PATH"

          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export OBJSIZE=llvm-size
          export STRIP=llvm-strip

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz dtbs

      # ============================================================
      # FIND KERNEL
      # ============================================================
      - name: Find kernel image
        run: |
          echo "Searching kernel image..."

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Found Image.gz"
            cp out/arch/arm64/boot/Image.gz ./Image.gz
          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "Found Image"
            cp out/arch/arm64/boot/Image ./Image
          else
            echo "ERROR: Kernel image not found!"
            find out/arch/arm64/boot -maxdepth 2 -type f -print
            exit 1
          fi

      # ============================================================
      # VERIFY BUILD
      # ============================================================
      - name: Verify kernel build
        run: |
          echo "=========================================="
          echo "KERNEL BUILD INFORMATION"
          echo "=========================================="

          echo "Kernel release:"
          make O=out ARCH=arm64 kernelrelease

          echo
          echo "Kernel version:"
          make O=out ARCH=arm64 kernelversion

          echo
          echo "Kernel image:"
          ls -lh Image* 2>/dev/null || true

          echo
          echo "Build config:"
          grep -E \
            'CONFIG_(KSU|KSU_MANUAL_HOOK|NOMOUNT|LOCALVERSION|LOCALVERSION_AUTO|LLVM_POLLY)' \
            out/.config || true

          echo "=========================================="

      # ============================================================
      # ANYKERNEL3
      # ============================================================
      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            anykernel

          rm -rf anykernel/.git

      # ============================================================
      # CONFIGURE ANYKERNEL3
      # ============================================================
      - name: Configure AnyKernel3
        run: |
          cat > anykernel/anykernel.sh <<'EOF'
          properties() { '
          kernel.string=zauksk Kernel - ReSukiSU - NoMount

          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0

          device.name1=gale
          device.name2=gust

          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          block=auto;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;

          write_boot;
          EOF

          echo "AnyKernel3 configured."

      # ============================================================
      # COPY KERNEL
      # ============================================================
      - name: Copy kernel to AnyKernel3
        run: |
          if [ -f Image.gz ]; then
            cp Image.gz anykernel/Image.gz
          elif [ -f Image ]; then
            cp Image anykernel/Image
          else
            echo "ERROR: No kernel image found"
            exit 1
          fi

      # ============================================================
      # CREATE BUILD INFO
      # ============================================================
      - name: Create build information
        run: |
          VERSION="$(make O=out ARCH=arm64 kernelrelease)"

          cat > anykernel/ZAUKSK_BUILD_INFO.txt <<EOF
          zauksk Kernel

          Kernel Version:
          $VERSION

          Device:
          Xiaomi Redmi 13C / POCO C65

          Codenames:
          gale / gust

          Architecture:
          arm64

          Kernel Base:
          Linux 4.19.325

          CIP:
          CIP136

          ST:
          ST20

          Root:
          ReSukiSU

          Hook:
          Manual Hook

          NoMount:
          Built-in

          Compiler:
          Clang r383902

          LLVM Polly:
          Disabled

          Build:
          GitHub Actions
          EOF

      # ============================================================
      # REMOVE UNNECESSARY FILES
      # ============================================================
      - name: Clean AnyKernel3 package
        run: |
          cd anykernel

          rm -rf .github
          rm -f LICENSE
          rm -f README.md
          rm -f ZAUKSK_BUILD_INFO.txt

          echo "Final AnyKernel3 files:"
          find . -maxdepth 2 -type f | sort

      # ============================================================
      # CREATE FLASHABLE ZIP
      # ============================================================
      - name: Create flashable ZIP
        run: |
          cd anykernel

          ZIP_NAME="zauksk-ReSukiSU-CIP136-ST20-gale.zip"

          rm -f "../$ZIP_NAME"

          FILES=(
            "META-INF"
            "modules"
            "patch"
            "ramdisk"
            "tools"
            "anykernel.sh"
            "banner"
          )

          if [ -f "Image.gz" ]; then
            FILES+=("Image.gz")
          elif [ -f "Image" ]; then
            FILES+=("Image")
          else
            echo "ERROR: Image/Image.gz missing"
            exit 1
          fi

          echo "Packaging:"
          printf ' - %s\n' "${FILES[@]}"

          zip -r9 "../$ZIP_NAME" "${FILES[@]}"

          cd ..

          echo
          echo "ZIP created:"
          ls -lh "$ZIP_NAME"

      # ============================================================
      # VALIDATE ZIP
      # ============================================================
      - name: Validate final ZIP
        run: |
          ZIP="zauksk-ReSukiSU-CIP136-ST20-gale.zip"

          test -f "$ZIP"

          echo "=========================================="
          echo "ZIP CONTENT"
          echo "=========================================="

          unzip -l "$ZIP"

          echo
          echo "=========================================="
          echo "CHECKING REQUIRED FILES"
          echo "=========================================="

          unzip -l "$ZIP" | grep -E \
            'META-INF/|modules/|patch/|ramdisk/|tools/|anykernel.sh|banner|Image.gz|Image'

          echo
          echo "ZIP validation: PASS"

      # ============================================================
      # SHA256
      # ============================================================
      - name: Generate SHA256
        run: |
          sha256sum \
            zauksk-ReSukiSU-CIP136-ST20-gale.zip \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zauksk-ReSukiSU-CIP136-ST20-gale-FLASHABLE
          path: |
            zauksk-ReSukiSU-CIP136-ST20-gale.zip
            SHA256SUMS.txt

      # ============================================================
      # COMPLETE
      # ============================================================
      - name: Complete
        run: |
          echo
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="
          echo
          echo "Kernel:"
          make O=out ARCH=arm64 kernelrelease
          echo
          echo "Expected:"
          echo "4.19.325-cip136-st20-zauksk"
          echo
          echo "ZIP:"
          echo "zauksk-ReSukiSU-CIP136-ST20-gale.zip"
          echo
          echo "Features:"
          echo "- CIP136"
          echo "- ST20"
          echo "- ReSukiSU"
          echo "- Manual Hook"
          echo "- NoMount"
          echo "- LTO/ThinLTO"
          echo "- CFI Clang"
          echo "- Shadow Call Stack"
          echo
          echo "=========================================="
