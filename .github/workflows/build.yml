name: Build #ice bear++ Kernel - gale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # CHECKOUT KERNEL SOURCE
      # ============================================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: xxblebleblexx/android_kernel_xiaomi_gale
          ref: dev
          fetch-depth: 1

      # ============================================================
      # CHECKOUT BUILDER CONFIG
      # ============================================================
      - name: Checkout builder files
        uses: actions/checkout@v4
        with:
          repository: Krisnaa19/kernel_builder_gale
          ref: main
          path: builder
          fetch-depth: 1

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            cpio \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            rsync \
            zip \
            unzip \
            python3 \
            wget \
            curl \
            git \
            ninja-build \
            patchelf \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      # ============================================================
      # INSTALL NEUTRON CLANG 23
      # ============================================================
      - name: Install Neutron Clang 23
        run: |
          set -e

          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"

          curl -fL \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o antman

          chmod +x antman

          ./antman -S=03062026

          # Fix GLIBC compatibility on Ubuntu 22.04
          ./antman --patch=glibc

          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"

      # ============================================================
      # VERIFY COMPILER
      # ============================================================
      - name: Verify compiler
        run: |
          set -e

          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"

          echo "=== Clang ==="
          clang --version

          echo "=== LLD ==="
          ld.lld --version

          echo "=== AArch64 GCC ==="
          aarch64-linux-gnu-gcc --version

          echo "=== AArch64 LD ==="
          aarch64-linux-gnu-ld --version

          echo "=== ARM32 GCC ==="
          arm-linux-gnueabi-gcc --version

          echo "=== ARM32 LD ==="
          arm-linux-gnueabi-ld --version

      # ============================================================
      # SETUP RESUKISU MANUAL HOOK
      # ============================================================
      - name: Setup ReSukiSU Manual Hook
        run: |
          set -e

          curl -LSs \
            https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh \
            | bash

      # ============================================================
      # SETUP NOMOUNT V2.0.0
      # ============================================================
      - name: Setup NoMount v2.0.0
        run: |
          set -e

          curl -LSs \
            https://raw.githubusercontent.com/maxsteeel/nomount/v2.0.0/kernel/setup.sh \
            | bash -s v2.0.0

      # ============================================================
      # INSTALL EXACT MB56 DEFCONFIG
      # ============================================================
      - name: Prepare MB56 defconfig
        run: |
          set -e

          mkdir -p arch/arm64/configs

          cp builder/configs/mb56_defconfig \
            arch/arm64/configs/mb56_defconfig

          # Rename only the kernel local version.
          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-#ice bear++"/' \
            arch/arm64/configs/mb56_defconfig

          echo "=== MB56 defconfig ==="
          grep '^CONFIG_LOCALVERSION=' \
            arch/arm64/configs/mb56_defconfig

          make O=out ARCH=arm64 mb56_defconfig

      # ============================================================
      # PREPARE BUILD CONFIG
      # ============================================================
      - name: Prepare kernel configuration
        run: |
          set -e

          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"

          make O=out ARCH=arm64 olddefconfig

          echo "=== Kernel configuration ==="

          grep -q '^CONFIG_KSU=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y' out/.config
          grep -q '^CONFIG_NOMOUNT=y' out/.config
          grep -q '^CONFIG_LTO_CLANG=y' out/.config
          grep -q '^CONFIG_LTO_CLANG_THIN=y' out/.config
          grep -q '^CONFIG_LLVM_POLLY=y' out/.config
          grep -q '^CONFIG_LOCALVERSION="-#ice bear++"' out/.config

          echo "=== Required configuration verified ==="

          echo "KSU:"
          grep '^CONFIG_KSU=' out/.config

          echo "Manual Hook:"
          grep '^CONFIG_KSU_MANUAL_HOOK=' out/.config

          echo "NoMount:"
          grep '^CONFIG_NOMOUNT=' out/.config

          echo "LTO:"
          grep '^CONFIG_LTO_' out/.config

          echo "Polly:"
          grep '^CONFIG_LLVM_POLLY=' out/.config

          echo "Local version:"
          grep '^CONFIG_LOCALVERSION=' out/.config

      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build kernel
        run: |
          set -e

          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            LLVM_POLLY=1 \
            LTO=thin \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

      # ============================================================
      # VERIFY KERNEL
      # ============================================================
      - name: Verify kernel
        run: |
          set -e

          test -f out/arch/arm64/boot/Image.gz

          test -f out/include/config/kernel.release

          VERSION="$(cat out/include/config/kernel.release)"

          echo "=========================================="
          echo "Kernel release: $VERSION"
          echo "=========================================="

          test "$VERSION" = "4.19.325-cip136-st20-#ice bear++"

          echo "Kernel version verified."

          echo "Image:"
          ls -lh out/arch/arm64/boot/Image.gz

      # ============================================================
      # CLONE ANYKERNEL3
      # ============================================================
      - name: Prepare AnyKernel3
        run: |
          set -e

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          rm -rf AnyKernel3/.git

          cp out/arch/arm64/boot/Image.gz \
            AnyKernel3/Image.gz

      # ============================================================
      # EXACT MB56 ANYKERNEL SCRIPT
      # moonbeam -> #ice bear++
      # AduhaiWelewele -> zauksk
      # ============================================================
      - name: Configure AnyKernel3
        run: |
          set -e

          cat > AnyKernel3/anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=#ice bear++-gale-kernel by zauksk on telegram
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=gale
          device.name2=gust
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties


          ### AnyKernel install
          ## boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          dump_boot; # use split_boot to skip ramdisk unpack, e.g. for devices with init_boot ramdisk

          # init.rc
          backup_file init.rc;
          replace_string init.rc "cpuctl cpu,timer_slack" "mount cgroup none /dev/cpuctl cpu" "mount cgroup none /dev/cpuctl cpu,timer_slack";

          # init.tuna.rc
          backup_file init.tuna.rc;
          insert_line init.tuna.rc "nodiratime barrier=0" after "mount_all /fstab.tuna" "\tmount ext4 /dev/block/by-name/userdata /data remount nosuid nodev noatime nodiratime barrier=0";
          append_file init.tuna.rc "bootscript" init.tuna;

          # fstab.tuna
          backup_file fstab.tuna;
          patch_fstab fstab.tuna /system ext4 options "noatime,barrier=1" "noatime,nodiratime,barrier=0";
          patch_fstab fstab.tuna /cache ext4 options "barrier=1" "barrier=0,nomblk_io_submit";
          patch_fstab fstab.tuna /data ext4 options "data=ordered" "nomblk_io_submit,data=writeback";
          append_file fstab.tuna "usbdisk" fstab;

          flash_boot; # TIDAK melakukan repack ramdisk, hanya update kernel


          ## init_boot files attributes
          #init_boot_attributes() {
          #set_perm_recursive 0 0 755 644 $RAMDISK/*;
          #set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          #} # end attributes

          # init_boot shell variables
          #BLOCK=init_boot;
          #IS_SLOT_DEVICE=1;
          #RAMDISK_COMPRESSION=auto;
          #PATCH_VBMETA_FLAG=auto;

          # reset for init_boot patching
          #reset_ak;

          # init_boot install
          #dump_boot; # unpack ramdisk since it is the new first stage init ramdisk where overlay.d must go

          #write_boot;
          ## end init_boot install


          ## vendor_kernel_boot shell variables
          #BLOCK=vendor_kernel_boot;
          #IS_SLOT_DEVICE=1;
          #RAMDISK_COMPRESSION=auto;
          #PATCH_VBMETA_FLAG=auto;

          # reset for vendor_kernel_boot patching
          #reset_ak;

          # vendor_kernel_boot install
          #split_boot; # skip unpack/repack ramdisk, e.g. for dtb on devices with hdr v4 and vendor_kernel_boot

          #flash_boot;
          ## end vendor_kernel_boot install


          ## vendor_boot files attributes
          #vendor_boot_attributes() {
          #set_perm_recursive 0 0 755 644 $RAMDISK/*;
          #set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          #} # end attributes

          # vendor_boot shell variables
          #BLOCK=vendor_boot;
          #IS_SLOT_DEVICE=1;
          #RAMDISK_COMPRESSION=auto;
          #PATCH_VBMETA_FLAG=auto;

          # reset for vendor_boot patching
          #reset_ak;

          # vendor_boot install
          #dump_boot; # use split_boot to skip ramdisk unpack, e.g. for dtb on devices with hdr v4 but no vendor_kernel_boot

          #write_boot; # use flash_boot to skip ramdisk repack, e.g. for dtb on devices with hdr v4 and no vendor_kernel_boot
          ## end vendor_boot install
          EOF

      # ============================================================
      # VERIFY ANYKERNEL SCRIPT
      # ============================================================
      - name: Verify AnyKernel3 script
        run: |
          set -e

          test -f AnyKernel3/anykernel.sh

          grep -q 'kernel.string=#ice bear++-gale-kernel by zauksk on telegram' \
            AnyKernel3/anykernel.sh

          grep -q 'BLOCK=/dev/block/by-name/boot;' \
            AnyKernel3/anykernel.sh

          grep -q 'flash_boot;' \
            AnyKernel3/anykernel.sh

          grep -q 'patch_fstab fstab.tuna /data ext4 options "data=ordered" "nomblk_io_submit,data=writeback";' \
            AnyKernel3/anykernel.sh

          echo "AnyKernel3 script verified."

      # ============================================================
      # CREATE FLASHABLE ZIP
      # ============================================================
      - name: Create flashable ZIP
        run: |
          set -e

          cd AnyKernel3

          zip -r9 \
            ../ice-bear-gale.zip \
            . \
            -x '*.git*' \
            -x 'README.md'

      # ============================================================
      # VERIFY ZIP
      # ============================================================
      - name: Verify ZIP
        run: |
          set -e

          test -f "ice-bear-gale.zip"

          unzip -t "ice-bear-gale.zip"

          echo "=========================================="
          echo "FLASHABLE ZIP:"
          echo "=========================================="

          ls -lh "ice-bear-gale.zip"

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ice-bear-gale-FLASHABLE
          path: "ice-bear-gale.zip"
