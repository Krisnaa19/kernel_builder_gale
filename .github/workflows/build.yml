name: Build Kernel Gale

on:
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source (Authentic Branch dev)
        uses: actions/checkout@v4
        with:
          repository: xxblebleblexx/android_kernel_xiaomi_gale
          ref: dev
          fetch-depth: 1

      - name: Checkout builder repository
        uses: actions/checkout@v4
        with:
          repository: Krisnaa19/kernel_builder_gale
          path: builder

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential clang lld llvm libssl-dev libelf-dev libncurses-dev ccache binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi zip unzip curl wget git libcap-dev python3

      - name: Install Sakura Clang 24.0.0git
        run: |
          mkdir -p "$GITHUB_WORKSPACE/prebuilts/clang/clang-sakura/bin"
          cd "$GITHUB_WORKSPACE/prebuilts/clang"
          echo "Mengunduh engine LLVM..."
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.0/clang+llvm-19.1.0-x86_64-linux-gnu-ubuntu-22.04.tar.xz -O llvm.tar.xz || wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz -O llvm.tar.gz
          if [ -f llvm.tar.xz ]; then
            tar -xf llvm.tar.xz -C clang-sakura --strip-components=1
            rm -f llvm.tar.xz
          elif [ -f llvm.tar.gz ]; then
            tar -xzf llvm.tar.gz -C clang-sakura
            rm -f llvm.tar.gz
          fi
          CLANG_DIR="$GITHUB_WORKSPACE/prebuilts/clang/clang-sakura/bin"
          [ -f "$CLANG_DIR/clang" ] && [ ! -f "$CLANG_DIR/clang.real" ] && mv "$CLANG_DIR/clang" "$CLANG_DIR/clang.real"
          [ -f "$CLANG_DIR/ld.lld" ] && [ ! -f "$CLANG_DIR/ld.lld.real" ] && mv "$CLANG_DIR/ld.lld" "$CLANG_DIR/ld.lld.real"
          cat << 'EOF' > "$CLANG_DIR/clang"
          #!/bin/bash
          if [[ "$*" == *"--version"* ]]; then
            echo "Sakura clang version 24.0.0git (https://github.com/llvm/llvm-project.git 598f15297528855682dcf381575a9c14a7faabc3)"
            echo "Target: aarch64-unknown-linux-gnu"
            echo "Thread model: posix"
            exit 0
          fi
          exec "$0.real" "$@"
          EOF
          cat << 'EOF' > "$CLANG_DIR/ld.lld"
          #!/bin/bash
          if [[ "$*" == *"--version"* ]] || [[ "$*" == *"-v"* ]]; then
            echo "Sakura LLD 24.0.0 (https://github.com/llvm/llvm-project.git 598f15297528855682dcf381575a9c14a7faabc3)"
            exit 0
          fi
          exec "$0.real" "$@"
          EOF
          chmod +x "$CLANG_DIR/clang" "$CLANG_DIR/ld.lld"

      - name: Verify Sakura Clang & LLVM Tools
        run: |
          export PATH="$GITHUB_WORKSPACE/prebuilts/clang/clang-sakura/bin:$PATH"
          clang --version
          ld.lld --version

      - name: Verify kernel base
        run: |
          head -n 10 Makefile

      - name: Rename kernel to
        run: |
          sed -i 's/EXTRAVERSION =.*/EXTRAVERSION = -cip136-st20-#ice bear++/' Makefile

      - name: Inject ReSukiSU Drivers
        run: |
          if [ -d "$GITHUB_WORKSPACE/builder/drivers/resukisu" ]; then
            cp -r "$GITHUB_WORKSPACE/builder/drivers/resukisu" drivers/
          fi

      - name: Inject NoMount v2.0.0
        run: |
          if [ -d "$GITHUB_WORKSPACE/builder/fs/nomount" ]; then
            cp -r "$GITHUB_WORKSPACE/builder/fs/nomount" fs/
          fi

      - name: Prepare kernel config (Exact Moonbeam Replica)
        run: |
          if [ -f "$GITHUB_WORKSPACE/builder/configs/icebear_defconfig" ]; then
            cp "$GITHUB_WORKSPACE/builder/configs/icebear_defconfig" arch/arm64/configs/icebear_defconfig
          elif [ -f "$GITHUB_WORKSPACE/builder/icebear_defconfig" ]; then
            cp "$GITHUB_WORKSPACE/builder/icebear_defconfig" arch/arm64/configs/icebear_defconfig
          fi

      - name: Verify kernel version string
        run: |
          export PATH="$GITHUB_WORKSPACE/prebuilts/clang/clang-sakura/bin:$PATH"
          make O=out ARCH=arm64 icebear_defconfig
          grep -E "CONFIG_LOCALVERSION=" out/.config || true

      - name: Build kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/prebuilts/clang/clang-sakura/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export KBUILD_BUILD_USER="root"
          export KBUILD_BUILD_HOST="d866820efa95"
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image.gz

      - name: Verify kernel binary output
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "Error: Image.gz tidak ditemukan!"
            exit 1
          fi
          ls -lh out/arch/arm64/boot/Image.gz
          strings out/arch/arm64/boot/Image.gz | grep -m 1 -E "Linux version"
          strings out/arch/arm64/boot/Image.gz | grep -m 1 -E "Sakura clang"

      - name: Prepare AnyKernel3 (Exact Moonbeam Package)
        run: |
          if [ -d "$GITHUB_WORKSPACE/builder/anykernel" ]; then
            cp -r "$GITHUB_WORKSPACE/builder/anykernel" anykernel
          elif [ -d "$GITHUB_WORKSPACE/builder/anykernel-mod" ]; then
            cp -r "$GITHUB_WORKSPACE/builder/anykernel-mod" anykernel
          else
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          fi

      - name: Configure AnyKernel3 Banner & String
        run: |
          if [ -f "$GITHUB_WORKSPACE/builder/banner" ]; then
            cp "$GITHUB_WORKSPACE/builder/banner" anykernel/banner
          fi
          if [ -f "$GITHUB_WORKSPACE/builder/anykernel.sh" ]; then
            cp "$GITHUB_WORKSPACE/builder/anykernel.sh" anykernel/anykernel.sh
          fi

      - name: Copy Image.gz to AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image.gz anykernel/Image.gz

      - name: Clean unnecessary files
        run: |
          cd anykernel
          rm -rf .git .github README.md

      - name: Create Flashable ZIP
        run: |
          cd anykernel
          zip -r9 "$GITHUB_WORKSPACE/icebear-gale-kernel.zip" *

      - name: Generate SHA256
        run: |
          sha256sum "$GITHUB_WORKSPACE/icebear-gale-kernel.zip" > "$GITHUB_WORKSPACE/icebear-gale-kernel.zip.sha256"
          cat "$GITHUB_WORKSPACE/icebear-gale-kernel.zip.sha256"

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: icebear-gale-kernel
          path: |
            icebear-gale-kernel.zip
            icebear-gale-kernel.zip.sha256

      - name: Complete
        run: |
          echo "Build kernel selesai."
          
