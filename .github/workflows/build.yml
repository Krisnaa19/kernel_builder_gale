name: Build #ice bear++ Kernel - CIP136 ST20

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: xxblebleblexx/android_kernel_xiaomi_gale
          ref: dev
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev libncurses5-dev libncurses-dev \
            python3 python3-pip zip unzip cpio rsync git curl wget pahole

      - name: Install AArch64 GCC
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Clang r383902
        run: |
          mkdir -p "$GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86"
          cd "$GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86"

          curl -L --retry 5 --retry-delay 3 \
            -o clang-r383902.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r383902.tar.gz"

          mkdir -p clang-r383902
          tar -xzf clang-r383902.tar.gz -C clang-r383902
          rm -f clang-r383902.tar.gz

      - name: Verify Clang
        run: |
          export CLANG="$GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86/clang-r383902/bin"

          "$CLANG/clang" --version
          "$CLANG/ld.lld" --version
          "$CLANG/llvm-ar" --version
          "$CLANG/llvm-nm" --version
          "$CLANG/llvm-objcopy" --version
          "$CLANG/llvm-objdump" --version
          "$CLANG/llvm-size" --version
          "$CLANG/llvm-strip" --version

      - name: Verify kernel base
        run: |
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile

          echo "CIP:"
          cat localversion-cip

          echo "ST:"
          cat localversion-st

          echo "Expected base version:"
          echo "4.19.325-cip136-st20"

      - name: Setup ReSukiSU
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash

      - name: Setup NoMount
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/maxsteeel/nomount/v2.0.0/kernel/setup.sh" \
            | bash -s v2.0.0

      - name: Rename kernel to #ice bear++
        run: |
          echo "Original CONFIG_LOCALVERSION:"
          grep '^CONFIG_LOCALVERSION=' arch/arm64/configs/gale_defconfig || true

          sed -i \
            's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-#ice bear++"/' \
            arch/arm64/configs/gale_defconfig

          echo "New CONFIG_LOCALVERSION:"
          grep '^CONFIG_LOCALVERSION=' arch/arm64/configs/gale_defconfig

          # Sync Moonbeam-style scheduler config
          sed -i '/^CONFIG_DEFAULT_MQ_IOSCHED_ADIOS=y$/d' arch/arm64/configs/gale_defconfig
          sed -i '/^CONFIG_MQ_IOSCHED_ADIOS=y$/d' arch/arm64/configs/gale_defconfig
          grep -q '^CONFIG_MQ_IOSCHED_SSG=y$' arch/arm64/configs/gale_defconfig || echo 'CONFIG_MQ_IOSCHED_SSG=y' >> arch/arm64/configs/gale_defconfig
          grep -q '^CONFIG_MQ_IOSCHED_SSG_CGROUP=y$' arch/arm64/configs/gale_defconfig || echo 'CONFIG_MQ_IOSCHED_SSG_CGROUP=y' >> arch/arm64/configs/gale_defconfig
          grep -q '^CONFIG_NET_SCH_CAKE=y$' arch/arm64/configs/gale_defconfig || echo 'CONFIG_NET_SCH_CAKE=y' >> arch/arm64/configs/gale_defconfig

          echo "Scheduler config:"
          grep -E 'CONFIG_(MQ_IOSCHED_ADIOS|MQ_IOSCHED_SSG|MQ_IOSCHED_SSG_CGROUP|NET_SCH_CAKE)' arch/arm64/configs/gale_defconfig || true

          echo -n "CIP = "
          cat localversion-cip

          echo -n "ST  = "
          cat localversion-st

      - name: Prepare kernel config
        run: |
          export ARCH=arm64

          mkdir -p out

          make O=out ARCH=arm64 gale_defconfig

          scripts/config --file out/.config \
            --enable CONFIG_KSU

          scripts/config --file out/.config \
            --enable CONFIG_KSU_MANUAL_HOOK

          scripts/config --file out/.config \
            --enable CONFIG_NOMOUNT

          # Clang r383902 tidak mendukung Polly
          scripts/config --file out/.config \
            --disable CONFIG_LLVM_POLLY

          scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-#ice bear++"

          scripts/config --file out/.config \
            --disable CONFIG_LOCALVERSION_AUTO

          make O=out ARCH=arm64 olddefconfig

          echo "=== Final scheduler configuration ==="
          grep -E 'CONFIG_(MQ_IOSCHED_ADIOS|MQ_IOSCHED_SSG|MQ_IOSCHED_SSG_CGROUP|NET_SCH_CAKE)' out/.config || true

          echo "=== Final kernel configuration ==="

          grep -E \
            'CONFIG_(LOCALVERSION|LOCALVERSION_AUTO|KSU|KSU_MANUAL_HOOK|NOMOUNT|LLVM_POLLY)' \
            out/.config || true

          echo "=== Kernel release ==="

          make -s --no-print-directory \
            O=out ARCH=arm64 kernelrelease

      - name: Verify ReSukiSU Manual Hook
        run: |
          grep -q '^CONFIG_KSU=y' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config

          echo "ReSukiSU Manual Hook: OK"

      - name: Verify NoMount
        run: |
          test -d fs/nomount

          grep -q '^CONFIG_NOMOUNT=y' out/.config

          echo "NoMount: OK"

      - name: Verify kernel version string
        run: |
          VERSION="$(make -s --no-print-directory \
            O=out ARCH=arm64 kernelrelease \
            | grep -E '^[0-9]' \
            | tr -d '\r\n')"

          echo "Actual:"
          echo "$VERSION"

          echo "Expected:"
          echo "4.19.325-cip136-st20-#ice bear++"

          if [ "$VERSION" != "4.19.325-cip136-st20-#ice bear++" ]; then
            echo "ERROR: Kernel version mismatch!"
            echo "Actual: $VERSION"
            exit 1
          fi

          echo "VERSION CHECK: PASS"

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86/clang-r383902/bin:$PATH"

          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export OBJSIZE=llvm-size
          export STRIP=llvm-strip

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz dtbs

      - name: Find kernel image
        run: |
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz Image.gz

          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image Image

          else
            echo "ERROR: Kernel image not found!"

            find out/arch/arm64/boot \
              -maxdepth 2 \
              -type f \
              -print

            exit 1
          fi

      - name: Verify kernel build
        run: |
          echo "=== Kernel release ==="

          make -s --no-print-directory \
            O=out ARCH=arm64 kernelrelease

          echo "=== Kernel version ==="

          make -s --no-print-directory \
            O=out ARCH=arm64 kernelversion

          echo "=== Kernel image ==="

          ls -lh Image* 2>/dev/null || true

          echo "=== Important config ==="

          grep -E \
            'CONFIG_(LOCALVERSION|LOCALVERSION_AUTO|KSU|KSU_MANUAL_HOOK|NOMOUNT|LLVM_POLLY)' \
            out/.config || true

      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            anykernel

          rm -rf anykernel/.git

      - name: Configure AnyKernel3
        run: |
          cat > anykernel/anykernel.sh <<'EOF'
          properties() { '
          kernel.string=#ice bear++ Kernel - ReSukiSU - NoMount
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=gale
          device.name2=gust
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          block=auto;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

      - name: Copy kernel to AnyKernel3
        run: |
          if [ -f Image.gz ]; then
            cp Image.gz anykernel/Image.gz

          elif [ -f Image ]; then
            cp Image anykernel/Image

          else
            echo "ERROR: Image/Image.gz missing"
            exit 1
          fi

      - name: Clean AnyKernel3 package
        run: |
          cd anykernel

          rm -rf .github
          rm -f LICENSE
          rm -f README.md
          rm -f ZAUKSK_BUILD_INFO.txt

          echo "=== Final AnyKernel3 files ==="

          find . -maxdepth 2 -type f | sort

      - name: Create flashable ZIP
        run: |
          ZIP_NAME="ice-bear-ReSukiSU-CIP136-ST20-gale.zip"

          cd anykernel

          rm -f "../$ZIP_NAME"

          FILES=(
            "META-INF"
            "modules"
            "patch"
            "ramdisk"
            "tools"
            "anykernel.sh"
            "banner"
          )

          if [ -f Image.gz ]; then
            FILES+=("Image.gz")

          elif [ -f Image ]; then
            FILES+=("Image")

          else
            echo "ERROR: Image/Image.gz missing"
            exit 1
          fi

          zip -r9 "../$ZIP_NAME" "${FILES[@]}"

          cd ..

          test -f "$ZIP_NAME"

          echo "=== Flashable ZIP ==="
          ls -lh "$ZIP_NAME"

      - name: Validate final ZIP
        run: |
          ZIP="ice-bear-ReSukiSU-CIP136-ST20-gale.zip"

          test -f "$ZIP"

          echo "=== ZIP contents ==="

          unzip -l "$ZIP"

          echo "=== Required files ==="

          unzip -l "$ZIP" | grep -E \
            'META-INF/|modules/|patch/|ramdisk/|tools/|anykernel.sh|banner|Image.gz|Image'

          echo "ZIP VALIDATION: PASS"

      - name: Generate SHA256
        run: |
          sha256sum \
            ice-bear-ReSukiSU-CIP136-ST20-gale.zip \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ice-bear-ReSukiSU-CIP136-ST20-gale-FLASHABLE
          path: |
            ice-bear-ReSukiSU-CIP136-ST20-gale.zip
            SHA256SUMS.txt

      - name: Complete
        run: |
          echo "========================================"
          echo "BUILD SUCCESS"
          echo "========================================"

          echo "Kernel:"
          make -s --no-print-directory \
            O=out ARCH=arm64 kernelrelease

          echo "Expected:"
          echo "4.19.325-cip136-st20-#ice bear++"

          echo "ZIP:"
          echo "ice-bear-ReSukiSU-CIP136-ST20-gale.zip"

          echo "========================================"
