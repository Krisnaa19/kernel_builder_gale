name: Build Redmi 13C Kernel with ReSukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev libncurses5-dev libssl-dev bc liblz4-tool libelf-dev python3

      - name: Download Clang Toolchain
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang

      - name: Clone Kernel Source
        run: |
          git clone https://github.com/xxblebleblexx/android_kernel_xiaomi_gale.git --depth=1 kernel-source

      - name: Integrate ReSukiSU & Patch Conflicts
        run: |
          cd kernel-source
          
          # 1. Integrasi ReSukiSU
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main || true
          
          # 2. Netralkan mtk_btag_pidlog di FUSE
          python3 -c '
          import re
          with open("fs/fuse/file.c", "r") as f:
              data = f.read()
          data = re.sub(r"mtk_btag_pidlog_set_pid_pages\s*\([^;]*\);", "/* mtk_btag_disabled */", data, flags=re.DOTALL)
          with open("fs/fuse/file.c", "w") as f:
              f.write(data)
          '

          # 3. Lumpuhkan lockdep.c
          sed -i 's/.*lockdep\.o.*/# skipped/g' kernel/locking/Makefile || true

          # 4. Kosongkan total isi block/ssg-iosched.c
          if [ -f block/ssg-iosched.c ]; then
            echo "/* SSG scheduler disabled */" > block/ssg-iosched.c
          fi
          sed -i 's/.*ssg-iosched\.o.*/# skipped/g' block/Makefile || true

          DEFCONFIG=$(find arch/arm64/configs/ -name "*gale*defconfig" | head -n 1)
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG="arch/arm64/configs/gale_defconfig"
          fi
          echo "Using defconfig: $DEFCONFIG"
          
          sed -i '/CONFIG_LOCKDEP/d' $DEFCONFIG
          sed -i '/CONFIG_PROVE_LOCKING/d' $DEFCONFIG
          sed -i '/CONFIG_DEBUG_LOCK_ALLOC/d' $DEFCONFIG
          sed -i '/CONFIG_IOSCHED_SSG/d' $DEFCONFIG
          echo "# CONFIG_LOCKDEP is not set" >> $DEFCONFIG
          echo "# CONFIG_PROVE_LOCKING is not set" >> $DEFCONFIG
          echo "# CONFIG_DEBUG_LOCK_ALLOC is not set" >> $DEFCONFIG
          echo "# CONFIG_IOSCHED_SSG is not set" >> $DEFCONFIG

          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG

      - name: Compile Kernel
        run: |
          cd kernel-source
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="zauksk"
          export KBUILD_BUILD_HOST="Builder"
          
          DEFCONFIG_NAME=$(ls arch/arm64/configs/ | grep gale | grep defconfig | head -n 1)
          if [ -z "$DEFCONFIG_NAME" ]; then
            DEFCONFIG_NAME="gale_defconfig"
          fi
          
          make O=out ARCH=arm64 $DEFCONFIG_NAME

          sed -i 's/CONFIG_LOCKDEP=y/# CONFIG_LOCKDEP is not set/g' out/.config || true
          sed -i 's/CONFIG_PROVE_LOCKING=y/# CONFIG_PROVE_LOCKING is not set/g' out/.config || true
          sed -i 's/CONFIG_DEBUG_LOCK_ALLOC=y/# CONFIG_DEBUG_LOCK_ALLOC is not set/g' out/.config || true
          sed -i 's/CONFIG_IOSCHED_SSG=y/# CONFIG_IOSCHED_SSG is not set/g' out/.config || true
          
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            LOCALVERSION="-zauksk" \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image.gz-dtb || \
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            LOCALVERSION="-zauksk" \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image.gz || \
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            LOCALVERSION="-zauksk" \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 ak3
          
          sed -i 's/device.name1=.*/device.name1=gale/g' ak3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=gust/g' ak3/anykernel.sh
          sed -i 's|block=.*|block=/dev/block/by-name/boot|g' ak3/anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=auto/g' ak3/anykernel.sh
          
          # Cari file Image hasil build di seluruh workspace tanpa batasan path kaku
          IMAGE_FILE=$(find kernel-source/ -type f \( -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" \) | head -n 1)
          
          if [ -z "$IMAGE_FILE" ]; then
            echo "Error: File kernel Image tidak ditemukan!"
            find kernel-source/ -name "*Image*"
            exit 1
          fi
          
          echo "Ditemukan kernel Image: $IMAGE_FILE"
          cp "$IMAGE_FILE" ak3/$(basename "$IMAGE_FILE")
          
          cd ak3
          zip -r9 ../Kernel-Redmi13C-zauksk-ReSukiSU.zip * -x .git README.md *placeholder

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi13C-zauksk-ReSukiSU
          path: Kernel-Redmi13C-zauksk-ReSukiSU.zip
          
